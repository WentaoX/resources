gleFS }}\" style=\"{{ fsTrackStyle }}\"><div style=\"width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(20,22,40,.25);flex-shrink:0;\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ hptCardStyle }}\">\n            <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:16px;\">\n              <div style=\"flex:1;\">\n                <div style=\"font-size:15.5px;font-weight:700;margin-bottom:4px;\">Hyperparameter tuning<\u002Fdiv>\n                <div style=\"font-size:13.5px;color:#5c616b;line-height:1.5;\">{{ hptDescription }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div onclick=\"{{ onToggleHPT }}\" style=\"{{ hptTrackStyle }}\"><div style=\"width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(20,22,40,.25);flex-shrink:0;\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ showHptSpace }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"margin-top:18px;padding-top:18px;border-top:1px solid #eef0f3;\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;\">\n                <div style=\"display:flex;align-items:center;gap:7px;\">\n                  <span style=\"font-size:13.5px;font-weight:700;color:#181a1f;\">Max tuning trials<\u002Fspan>\n                  <span class=\"cc-tip-wrap\">\n                    <span style=\"width:16px;height:16px;border-radius:50%;background:#eef0f3;color:#9398a1;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:help;\">?<\u002Fspan>\n                    <span class=\"cc-tip\">A higher number means you’ll probably find better parameters, but the run will take longer.<\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fdiv>\n                <input value=\"{{ maxTrials }}\" onchange=\"{{ onMaxTrials }}\" type=\"num >\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showDataStep }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;flex-direction:column;gap:16px;\">\n        <div style=\"background:#fff;border:1px solid #e9eaee;border-radius:16px;padding:22px;box-shadow:0 1px 2px rgba(20,22,40,.04);\">\n          <div style=\"font-size:15.5px;font-weight:700;margin-bottom:3px;\">Train / validation / test split<\u002Fdiv>\n          <div style=\"font-size:13.5px;color:#5c616b;margin-bottom:16px;\">How to partition rows into training, tuning (validation), and final evaluation (test) sets.<\u002Fdiv>\n          <div style=\"display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap;\">\n            <sc-if value=\"{{ splitIsRandom }}\" hint-placeholder-val=\"{{ true }}\"><button onclick=\"{{ onSplitRandom }}\" style=\"border-radius:10px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid #f6cdc8;background:#fdecea;color:#e2231a;\">Random sampling<\u002Fbutton><\u002Fsc-if>\n            <sc-if value=\"{{ splitIsTime }}\" hint-placeholder-val=\"{{ false }}\"><button onclick=\"{{ onSplitRandom }}\" style=\"border-radius:10px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid #dcdee3;background:#fff;color:#5c616b;\">Random sampling<\u002Fbutton><\u002Fsc-if>\n            <sc-if value=\"{{ splitIsTime }}\" hint-placeholder-val=\"{{ false }}\"><button onclick=\"{{ onSplitTime }}\" style=\"border-radius:10px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid #f6cdc8;background:#fdecea;color:#e2231a;\">Time-based splitting<\u002Fbutton><\u002Fsc-if>\n            <sc-if value=\"{{ splitIsRandom }}\" hint-placeholder-val=\"{{ true }}\"><button onclick=\"{{ onSplitTime }}\" style=\"border-radius:10px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid #dcdee3;background:#fff;color:#5c616b;\">Time-based splitting  true }}\">\n        <div style=\"margin-top:20px;padding-top:20px;border-top:1px solid #eef0f3;\">\n          <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:12px;\">\n            <div style=\"font-size:13.5px;font-weight:700;\">Tuned hyperparameters<\u002Fdiv>\n            <span style=\"font-size:10.5px;font-weight:600;color:#14935f;background:#e6f5ee;padding:2px 8px;border-radius:6px;\">{{ selTrialsLabel }}<\u002Fspan>\n            <button onclick=\"{{ onDownloadHPT }}\" style-hover=\"background:#fef5f3;border-color:#e2231a;color:#e2231a;\" style=\"margin-left:auto;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #dcdee3;border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600;color:#5c616b;cursor:pointer;transition:.12s;\"><span style=\"font-size:11px;\">⬇<\u002Fspan> Trials (Excel)<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:12px;\">\n            <sc-for list=\"{{ selHptRows }}\" as=\"p\" hint-placeholder-count=\"3\">\n              <div style=\"background:#fef5f3;border:1px solid #f6cdc8;border-radius:11px;padding:12px 14px;\">\n                <div style=\"font-size:12px;color:#9398a1;font-family:'JetBrains Mono',monospace;margin-bottom:5px;\">{{ p.key }}<\u002Fdiv>\n                <div style=\"font-size:14.5px;font-weight:700;color:#e2231a;font-family:'JetBrains Mono',monospace;\">{{ p.value }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ selCanRefine }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:20px;padding-top:20px;border-top:1px solid #eef0f3;\">\n          <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:5px;\">\n            <div style=\"font-size:13.5px;font-weight:700;\">Refine &amp; add to experiment<\u002Fdiv>\n            <span style=\"font-size:10.5px;font-weight:600;color:#e2231a;background:#fdecea;padding:2px 8px;border-radius:6px;\">New round<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#9398a1;margin-bottom:16px;\">Train a new {{ refineName }} on the top-ranked features with hyperparameters you set. It joins the leaderboard as a new round.<\u002Fdiv>\n\n          <sc-if value=\"{{ refineHasFS }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"margin-bottom:18px;\">\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;\">\n              <div style=\"font-size:13px;font-weight:600;\">Use top <span style=\"font-family:'JetBrains Mono',monospace;color:#e2231a;\">{{ refineTopN }}<\u002Fspan> of {{ refineRankedCount }} features<\u002Fdiv>\n              <span style=\"font-size:11.5px;color:#9398a1;\">ranked by importance<\u002Fspan>\n            <\u002Fdiv>\n            <input type=\"range\" min=\"{{ refineTopNMin }}\" max=\"{{ refineRankedCount }}\" step=\"1\" value=\"{{ refineTopN }}\" oninput=\"{{ onRefineTopN }}\" style=\"width:100%;accent-color:#e2231a;cursor:pointer;\">\n            <div style=\"display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;\">\n              <sc-for list=\"{{ refineFeatureChips }}\" as=\"c\" hint-placeholder-count=\"5\"><span style=\"{{ c.style }}\">{{ c.name }}<\u002Fspan><\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ refineChipsExpandable }}\" hint-placeholder-val=\"{{ false }}\">\n            <button onclick=\"{{ onToggleRefineChips }}\" style-hover=\"background:#f2f3f6;\" style=\"margin-top:11px;width:100%;display:flex;align-items:center;justify-content:center;gap:7px;background:#fff;border:1px solid #e3e5ea;border-radius:10px;padding:8px 0;font-size:12.5px;font-weight:600;color:#e2231a;cursor:pointer;transition:.1s;\">{{ refineChipsExpandLabel }}<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ refineHasParams }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"margin-bottom:18px;\">\n            <div style=\"font-size:13px;font-weight:600;margin-bottom:10px;\">Hyperparameters<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;\">\n              <sc-for list=\"{{ refineParamRows }}\" as=\"p\" hint-placeholder-count=\"3\">\n                <div style=\"background:#fafafc;border:1px solid #eef0f3;border-radius:11px;padding:11px 13px;\">\n                  <div style=\"font-size:12px;color:#9398a1;font-family:'JetBrains Mono',monospace;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ p.key }}<\u002Fdiv>\n                  <sc-if value=\"{{ p.isSelect }}\" hint-placeholder-val=\"{{ false }}\">\n                    <select value=\"{{ p.value }}\" onchange=\"{{ p.onChange }}\" style=\"width:100%;padding:8px 10px;border:1px solid #dcdee3;border-radius:8px;font-size:13px;font-family:'JetBrains Mono',monospace;background-color:#fff;outline:none;cursor:pointer;\">\n                      <sc-for list=\"{{ p.options }}\" as=\"o\" hint-placeholder-count=\"2\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for>\n                    <\u002Fselect>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ p.isNumber }}\" hint-placeholder-val=\"{{ true }}\">\n                    <input type=\"number\" value=\"{{ p.value }}\" step=\"{{ p.step }}\" onchange=\"{{ p.onChange }}\" style=\"width:100%;padding:8px 10px;border:1px solid #dcdee3;border-radius:8px;font-size:13px;font-family:'JetBrains Mono',monospace;outline:none;\">\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"display:flex;align-items:center;gap:11px;\">\n            <button onclick=\"{{ onRefineTrain }}\" style-hover=\"background:#b81910;\" style=\"background:#e2231a;color:#fff;border:none;border-radius:10px;padding:11px 18px;font-weight:600;font-size:13.5px;cursor:pointer;transition:background .12s;display:flex;align-items:center;gap:6px;\"><span style=\"font-size:16px;line-height:0;\">+<\u002Fspan>Add to experiment<\u002Fbutton>\n            <button onclick=\"{{ onRefineReset }}\" style-hover=\"background:#f2f3f6;\" style=\"background:#fff;border:1px solid #dcdee3;color:#5c616b;border-radius:10px;padding:11px 15px;font-weight:600;font-size:13px;cursor:pointer;transition:.12s;\">Reset<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      \n\n      <sc-if value=\"{{ hasPredictions }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"background:#fff;border:1px solid #e9eaee;border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(20,22,40,.04);margin-bottom:16px;\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;padding:16px 20px 14px;\">\n          <div style=\"font-size:15px;font-weight:700;\">Predictions<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#9398a1;\">{{ predictionCountLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1.3fr 1.1fr 1.6fr 0.8fr 96px;gap:10px;padding:9px 20px;background:#fafafc;border-top:1px solid #eef0f3;border-bottom:1px solid #eef0f3;font-size:11px;font-weight:700;color:#9398a1;text-transform:uppercase;letter-spacing:0.05em;\">\n          <div>Model<\u002Fdiv><div>Input data<\u002Fdiv><div>Saved to<\u002Fdiv><div>Rows<\u002Fdiv><div style=\"text-align:right;\">When<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ predictionRows }}\" as=\"p\" hint-placeholder-count=\"2\">\n          <div style=\"display:grid;grid-template-columns:1.3fr 1.1fr 1.6fr 0.8fr 96px;gap:10px;padding:15px 20px;border-bottom:1px solid #f2f3f6;align-items:center;\">\n            <div style=\"font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">{{ p.algoName }}<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#5c616b;font-family:'JetBrains Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">{{ p.tableLabel }}<\u002Fdiv>\n            <div style=\"min-width:0;\">\n              <div style=\"display:flex;align-items:center;gap:7px;\">\n                <span style=\"{{ p.destBadgeStyle }}\">{{ p.destBadge }}<\u002Fspan>\n                <span style=\"font-size:12.5px;color:#181a1f;font-family:'JetBrains Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">{{ p.savedTo }}<\u002Fspan>\n              <\u002Fdiv>\n              <sc-if value=\"{{ p.emailed }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:11px;color:#14935f;margin-top:3px;\">Emailed to {{ p.emailedTo }}<\u002Fdiv><\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"font-size:13px;color:#5c616b;font-family:'JetBrains Mono',monospace;\">{{ p.rows }}<\u002Fdiv>\n            <div style=\"font-size:12px;color:#9398a1;text-align:right;\">{{ p.createdAt }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ showActionBar }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"position:fixed;bottom:0;left:0;right:0;z-index:25;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-top:1px solid #e9eaee;padding:14px 22px;\">\n      <div style=\"max-width:960px;margin:0 auto;display:flex;align-items:center;gap:14px;\">\n        <div style=\"min-width:0;flex:1;\">\n          <div style=\"font-size:12px;color:#9398a1;\">Selected model<\u002Fdiv>\n          <div style=\"font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">{{ actionBarLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ mmpIsNone }}\" hint-placeholder-val=\"{{ true }}\">\n        <button onclick=\"{{ onSubmitMMP }}\" style-hover=\"background:#f2f3f6;\" style=\"background:#fff;border:1px solid #dcdee3;color:#181a1f;border-radius:11px;padding:11px 18px;font-weight:600;font-size:13.5px;cursor:pointer;transition:.12s;\">Submit to MMP<\u002Fbutton>\n        <button title=\"Submit to MMP and get approval before running predictions\" style=\"background:#e3e5ea;color:#9398a1;border:none;border-radius:11px;padding:11px 20px;font-weight:600;font-size:13.5px;cursor:not-allowed;\">Run prediction<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ mmpIsPending }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:#c07d18;background:#fbf1df;padding:8px 12px;border-radius:9px;flex-shrink:0;\"><span style=\"width:7px;height:7px;border-radius:50%;background:#e0a020;display:inline-block;\"><\u002Fspan>In MMP review<\u002Fdiv>\n        <button onclick=\"{{ onCheckApproval }}\" style-hover=\"background:#f2f3f6;\" style=\"background:#fff;border:1px solid #dcdee3;color:#181a1f;border-radius:11px;padding:11px 18px;font-weight:600;font-size:13.5px;cursor:pointer;transition:.12s;\">Check approval status<\u002Fbutton>\n        <button title=\"Model must be approved in MMP first\" style=\"background:#e3e5ea;color:#9398a1;border:none;border-radius:11px;padding:11px 20px;font-weight:600;font-size:13.5px;cursor:not-allowed;\">Run prediction<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ mmpIsApproved }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:#14935f;background:#e6f5ee;padding:8px 12px;border-radius:9px;flex-shrink:0;\">✓ Approved in MMP<\u002Fdiv>\n        <button onclick=\"{{ onRunPrediction }}\" style-hover=\"background:#b81910;\" style=\"background:#e2231a;color:#fff;border:none;border-radius:11px;padding:11px 20px;font-weight:600;font-size:13.5px;cursor:pointer;transition:background .12s;\">Run prediction<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isPredConfig }}\" hint-placeholder-val=\"{{ true }}\">\n    <div data-screen-label=\"Prediction setup\" style=\"max-width:760px;margin:0 auto;padding:26px 22px 80px;\">\n      <button onclick=\"{{ onBackToResults }}\" style=\"background:none;border:none;color:#9398a1;cursor:pointer;font-size:13.5px;font-weight:600;padding:0;margin-bottom:18px;display:flex;align-items:center;gap:5px;\">← Back to results<\u002Fbutton>\n      <div style=\"margin-bottom:22px;\">\n        <div style=\"font-size:24px;font-weight:800;letter-spacing:-0.03em;\">Run prediction<\u002Fdiv>\n        <div style=\"font-size:13.5px;color:#5c616b;margin-top:3px;\">Score new data with <strong>{{ predModelName }}<\u002Fstrong> from {{ predExpName }}.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:16px;\">\n        <div style=\"background:#fff;border:1px solid #e9eaee;border-radius:16px;padding:22px;box-shadow:0 1px 2px rgba(20,22,40,.04);\">\n          <div style=\"font-size:15.5px;font-weight:700;margin-bottom:3px;\">Inference table<\u002Fdiv>\n          <div style=\"font-size:13.5px;color:#5c616b;margin-bottom:14px;\">The Hadoop table to score. It must contain the model’s feature columns.<\u002Fdiv>\n          <select value=\"{{ predTable }}\" onchange=\"{{ onPredTable }}\" style=\"width:100%;padding:12px 14px;border:1px solid #dcdee3;border-radius:11px;font-size:14px;color:#181a1f;background-color:#fff;outline:none;cursor:pointer;\">\n            <option value=\"\">Select a table…<\u002Foption>\n            <sc-for list=\"{{ tableOptions }}\" as=\"t\" hint-placeholder-count=\"4\"><option value=\"{{ t.value }}\">{{ t.optLabel }}<\u002Foption><\u002Fsc-for>\n          <\u002Fselect>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasPredTable }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"background:#fff;border:1px solid #e9eaee;border-radius:16px;padding:22px;box-shadow:0 1px 2px rgba(20,22,40,.04);\">\n          <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:4px;\">\n            <div style=\"font-size:15.5px;font-weight:700;\">Features<\u002Fdiv>\n            <span style=\"font-size:11px;font-weight:600;color:#e2231a;background:#fdecea;padding:2px 8px;border-radius:6px;\">From trained model<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:13.5px;color:#5c616b;margin-bottom:14px;\">Inference uses the {{ predFeatureCount }} feature columns the model was trained on.<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:7px;\">\n            <sc-for list=\"{{ predFeatureChips }}\" as=\"c\" hint-placeholder-count=\"4\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;background:#f2f3f6;color:#5c616b;padding:5px 11px;border-radius:8px;\">{{ c }}<\u002Fspan><\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ predFeaturesExpandable }}\" hint-placeholder-val=\"{{ false }}\">\n          <button onclick=\"{{ onTogglePredFeatures }}\" style-hover=\"background:#f2f3f6;\" style=\"margin-top:11px;width:100%;display:flex;align-items:center;justify-content:center;gap:7px;background:#fff;border:1px solid #e3e5ea;border-radius:10px;padding:8px 0;font-size:12.5px;font-weight:600;color:#e2231a;cursor:pointer;transition:.1s;\">{{ predFeaturesExpandLabel }}<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #e9eaee;border-radius:16px;padding:22px;box-shadow:0 1px 2px rgba(20,22,40,.04);\">\n          <div style=\"font-size:15.5px;font-weight:700;margin-bottom:3px;\">Filter conditions<\u002Fdiv>\n          <div style=\"font-size:13.5px;color:#5c616b;margin-bottom:15px;\">Optional — limit which rows get scored. Combine with AND / OR and group with brackets.<\u002Fdiv>\n          <sc-for list=\"{{ predFilterRows }}\" as=\"f\" hint-placeholder-count=\"0\">\n            <sc-if value=\"{{ f.showConn }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex;justify-content:center;margin:2px 0 7px;\">\n                <button onclick=\"{{ f.onConn }}\" style=\"{{ f.connStyle }}\">{{ f.conn }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"display:flex;gap:7px;align-items:center;margin-bottom:9px;\">\n              <button onclick=\"{{ f.onOpen }}\" title=\"Open brackets\" style=\"{{ f.openStyle }}\">{{ f.openLabel }}<\u002Fbutton>\n              <select value=\"{{ f.column }}\" onchange=\"{{ f.onCol }}\" style=\"flex:1.4;min-width:0;padding:9px 12px;border:1px solid #dcdee3;border-radius:9px;font-size:13px;color:#181a1f;background-color:#fff;outline:none;cursor:pointer;font-family:'JetBrains Mono',monospace;\">\n                <sc-for list=\"{{ f.columnOptions }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n              <\u002Fselect>\n              <select value=\"{{ f.op }}\" onchange=\"{{ f.onOp }}\" style=\"width:104px;flex-shrink:0;padding:9px 10px;border:1px solid #dcdee3;border-radius:9px;font-size:13px;color:#181a1f;background-color:#fff;outline:none;cursor:pointer;\">\n                <sc-for list=\"{{ operatorOptions }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n              <\u002Fselect>\n              <input value=\"{{ f.value }}\" onchange=\"{{ f.onVal }}\" placeholder=\"value\" style=\"flex:1;min-width:0;padding:9px 12px;border:1px solid #dcdee3;border-radius:9px;font-size:13px;outline:none;\">\n              <button onclick=\"{{ f.onClose }}\" title=\"Close brackets\" style=\"{{ f.closeStyle }}\">{{ f.closeLabel }}<\u002Fbutton>\n              <button onclick=\"{{ f.onRemove }}\" style-hover=\"background:#fcebec;color:#d64550;\" style=\"width:34px;height:34px;flex-shrink:0;background:#f2f3f6;border:none;border-radius:9px;color:#9398a1;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;\">×<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ showPredFilterPreview }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"margin:4px 0 12px;padding:11px 14px;background:#fafafc;border:1px solid #eef0f3;border-radius:10px;\">\n              <div style=\"font-size:10.5px;font-weight:700;color:#9398a1;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:5px;\">WHERE<\u002Fdiv>\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#181a1f;line-height:1.6;word-break:break-word;\">{{ predFilterPreview }}<\u002Fdiv>\n              <sc-if value=\"{{ predFilterUnbalanced }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:11.5px;color:#d64550;margin-top:7px;\">Unbalanced brackets — check your ( and ) counts.<\u002Fdiv><\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <button onclick=\"{{ onAddPredFilter }}\" style-hover=\"border-color:#e2231a;color:#e2231a;\" style=\"margin-top:2px;background:#fff;border:1px dashed #cdd0d6;border-radius:9px;padding:9px 14px;font-size:13px;font-weight:600;color:#5c616b;cursor:pointer;transition:.12s;\">+ Add condition<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #e9eaee;border-radius:16px;padding:22px;box-shadow:0 1px 2px rgba(20,22,40,.04);\">\n          <div style=\"font-size:15.5px;font-weight:700;margin-bottom:3px;\">Prediction output<\u002Fdiv>\n          <div style=\"font-size:13.5px;color:#5c616b;margin-bottom:15px;\">Where should the scored output be written?<\u002Fdiv>\n          <div style=\"display:flex;gap:9px;margin-bottom:18px;\">\n            <button onclick=\"{{ onDestTable }}\" style=\"{{ destTableStyle }}\">Hadoop table<\u002Fbutton>\n            <button onclick=\"{{ onDestDownload }}\" style=\"{{ destDownloadStyle }}\">Downloadable file<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ destIsTable }}\" hint-placeholder-val=\"{{ true }}\">\n          <div>\n            <label style=\"display:block;font-size:13px;font-weight:600;margin-bottom:7px;\">Output table<\u002Flabel>\n            <select value=\"{{ resultTable }}\" onchange=\"{{ onResultTable }}\" style=\"width:100%;padding:11px 14px;border:1px solid #dcdee3;border-radius:11px;font-size:14px;color:#181a1f;background-color:#fff;outline:none;cursor:pointer;font-family:'JetBrains Mono',monospace;\">\n              <option value=\"\">Select output table…<\u002Foption>\n              <sc-for list=\"{{ outputTableOptions }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n            <\u002Fselect>\n            <div style=\"font-size:12px;color:#9398a1;margin-top:8px;\">Predictions are written back to this Hadoop table. Email delivery isn’t available for table output.<\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ destIsDownload }}\" hint-placeholder-val=\"{{ true }}\">\n          <div>\n            <div style=\"display:flex;align-items:center;gap:9px;background:#f6f7f9;border-radius:11px;padding:11px 14px;margin-bottom:18px;font-size:12.5px;color:#5c616b;\">\n              <div style=\"width:6px;height:6px;border-radius:50%;background:#9398a1;flex-shrink:0;\"><\u002Fdiv>\n              Output is staged on HDFS and downloadable as CSV once scoring finishes.\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:16px;\">\n              <div style=\"flex:1;\">\n                <div style=\"font-size:14px;font-weight:700;margin-bottom:3px;\">Auto-email results<\u002Fdiv>\n                <div style=\"font-size:13px;color:#5c616b;line-height:1.5;\">Email the CSV to a recipient automatically when scoring finishes.<\u002Fdiv>\n              <\u002Fdiv>\n              <div onclick=\"{{ onToggleAutoEmail }}\" style=\"{{ autoEmailTrackStyle }}\"><div style=\"width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(20,22,40,.25);flex-shrink:0;\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ autoEmail }}\" hint-placeholder-val=\"{{ true }}\">\n            <input value=\"{{ autoEmailTo }}\" onchange=\"{{ onAutoEmailTo }}\" placeholder=\"recipient@company.com\" style=\"margin-top:14px;width:100%;padding:11px 14px;border:1px solid #dcdee3;border-radius:11px;font-size:14px;outline:none;\">\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;margin-top:26px;\">\n        <button onclick=\"{{ onBackToResults }}\" style-hover=\"background:#f2f3f6;\" style=\"background:#fff;border:1px solid #dcdee3;color:#181a1f;border-radius:11px;padding:12px 20px;font-weight:600;font-size:14px;cursor:pointer;transition:.12s;\">Cancel<\u002Fbutton>\n        <button onclick=\"{{ onRunPredJob }}\" style=\"{{ runPredStyle }}\">Run prediction<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isPredResults }}\" hint-placeholder-val=\"{{ true }}\">\n    <div data-screen-label=\"Prediction results\" style=\"max-width:820px;margin:0 auto;padding:26px 22px 80px;\">\n      <button onclick=\"{{ onBackToResults }}\" style=\"background:none;border:none;color:#9398a1;cursor:pointer;font-size:13.5px;font-weight:600;padding:0;margin-bottom:18px;display:flex;align-items:center;gap:5px;\">← Back to results<\u002Fbutton>\n      <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap;\">\n        <div>\n          <div style=\"display:flex;align-items:center;gap:11px;margin-bottom:5px;\">\n            <div style=\"font-size:24px;font-weight:800;letter-spacing:-0.03em;\">Prediction complete<\u002Fdiv>\n            <span style=\"padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:700;background:#e6f5ee;color:#14935f;\">Completed<\u002Fspan>\n            <sc-if value=\"{{ predEmailed }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size:11px;font-weight:600;color:#14935f;background:#e6f5ee;padding:3px 9px;border-radius:7px;\">Emailed<\u002Fspan><\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"font-size:13.5px;color:#9398a1;font-family:'JetBrains Mono',monospace;\">{{ predResSub }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:9px;\">\n          <sc-if value=\"{{ predResIsDownload }}\" hint-placeholder-val=\"{{ true }}\">\n            <button onclick=\"{{ onEmailResults }}\" style-hover=\"background:#f2f3f6;\" style=\"background:#fff;border:1px solid #dcdee3;color:#181a1f;border-radius:10px;padding:10px 15px;font-weight:600;font-size:13.5px;cursor:pointer;\">Email…<\u002Fbutton>\n            <button onclick=\"{{ onDownload }}\" style-hover=\"background:#b81910;\" style=\"background:#e2231a;color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:600;font-size:13.5px;cursor:pointer;transition:background .12s;\">Download CSV<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ predResIsTable }}\" hint-placeholder-val=\"{{ true }}\">\n            <button onclick=\"{{ onOpenTable }}\" style-hover=\"background:#b81910;\" style=\"background:#e2231a;color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:600;font-size:13.5px;cursor:pointer;transition:background .12s;\">Open in Hadoop<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;\">\n        <sc-for list=\"{{ predResCards }}\" as=\"m\" hint-placeholder-count=\"3\">\n          <div style=\"background:#fff;border:1px solid #e9eaee;border-radius:14px;padding:16px;box-shadow:0 1px 2px rgba(20,22,40,.04);\">\n            <div style=\"font-size:11px;font-weight:700;color:#9398a1;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:7px;\">{{ m.label }}<\u002Fdiv>\n            <div style=\"font-size:18px;font-weight:800;letter-spacing:-0.02em;font-family:'JetBrains Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">{{ m.value }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ predResIsTable }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;align-items:center;gap:11px;background:#fff;border:1px solid #e9eaee;border-radius:14px;padding:14px 18px;box-shadow:0 1px 2px rgba(20,22,40,.04);\">\n        <div style=\"width:30px;height:30px;border-radius:8px;background:#fdecea;display:flex;align-items:center;justify-content:center;flex-shrink:0;\"><div style=\"width:13px;height:11px;border:2px solid #e2231a;border-radius:2px;\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"min-width:0;\">\n          <div style=\"font-size:12px;color:#9398a1;font-weight:600;\">Predictions written to Hadoop table<\u002Fdiv>\n          <div style=\"font-size:14px;font-weight:700;font-family:'JetBrains Mono',monospace;\">{{ predResTable }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-left:auto;font-size:12px;color:#aab0b8;\">Email delivery is only available for downloadable output.<\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ mmpModal }}\" hint-placeholder-val=\"{{ true }}\">\n  <div onclick=\"{{ onCloseMMP }}\" style=\"position:fixed;inset:0;z-index:50;background:rgba(20,22,40,.4);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:24px;\">\n    <div onclick=\"{{ stop }}\" style=\"background:#fff;border-radius:18px;padding:26px;width:100%;max-width:430px;box-shadow:0 20px 60px rgba(20,22,40,.25);\">\n      <div style=\"font-size:18px;font-weight:700;letter-spacing:-0.01em;margin-bottom:5px;\">Submit to MMP<\u002Fdiv>\n      <div style=\"font-size:13.5px;color:#5c616b;margin-bottom:20px;\">Register <strong>{{ mmpAlgoName }}<\u002Fstrong> with the Model Management Platform.<\u002Fdiv>\n      <label style=\"display:block;font-size:13px;font-weight:600;margin-bottom:7px;\">Model name<\u002Flabel>\n      <input value=\"{{ mmpName }}\" onchange=\"{{ onMmpName }}\" style=\"width:100%;padding:11px 14px;border:1px solid #dcdee3;border-radius:11px;font-size:14px;margin-bottom:15px;outline:none;\">\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:22px;\">\n        <div>\n          <label style=\"display:block;font-size:13px;font-weight:600;margin-bottom:7px;\">Version<\u002Flabel>\n          <input value=\"{{ mmpVersion }}\" onchange=\"{{ onMmpVersion }}\" style=\"width:100%;padding:11px 14px;border:1px solid #dcdee3;border-radius:11px;font-size:14px;outline:none;font-family:'JetBrains Mono',monospace;\">\n        <\u002Fdiv>\n        <div>\n          <label style=\"display:block;font-size:13px;font-weight:600;margin-bottom:7px;\">Target stage<\u002Flabel>\n          <select value=\"{{ mmpEnv }}\" onchange=\"{{ onMmpEnv }}\" style=\"width:100%;padding:11px 14px;border:1px solid #dcdee3;border-radius:11px;font-size:14px;color:#181a1f;background-color:#fff;outline:none;cursor:pointer;\">\n            <option value=\"Staging\">Staging<\u002Foption>\n            <option value=\"Production\">Production<\u002Foption>\n            <option value=\"Shadow\">Shadow<\u002Foption>\n          <\u002Fselect>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:9px;justify-content:flex-end;\">\n        <button onclick=\"{{ onCloseMMP }}\" style=\"background:#fff;border:1px solid #dcdee3;color:#181a1f;border-radius:10px;padding:10px 16px;font-weight:600;font-size:13.5px;cursor:pointer;\">Cancel<\u002Fbutton>\n        <button onclick=\"{{ onConfirmMMP }}\" style=\"background:#e2231a;color:#fff;border:none;border-radius:10px;padding:10px 18px;font-weight:600;font-size:13.5px;cursor:pointer;\">Submit<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ emailModal }}\" hint-placeholder-val=\"{{ true }}\">\n  <div onclick=\"{{ onCloseEmail }}\" style=\"position:fixed;inset:0;z-index:50;background:rgba(20,22,40,.4);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:24px;\">\n    <div onclick=\"{{ stop }}\" style=\"background:#fff;border-radius:18px;padding:26px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(20,22,40,.25);\">\n      <div style=\"font-size:18px;font-weight:700;letter-spacing:-0.01em;margin-bottom:5px;\">Email results<\u002Fdiv>\n      <div style=\"font-size:13.5px;color:#5c616b;margin-bottom:18px;\">Send the prediction output as a CSV attachment.<\u002Fdiv>\n      <label style=\"display:block;font-size:13px;font-weight:600;margin-bottom:7px;\">Recipient<\u002Flabel>\n      <input value=\"{{ emailTo }}\" onchange=\"{{ onEmailTo }}\" placeholder=\"name@company.com\" style=\"width:100%;padding:11px 14px;border:1px solid #dcdee3;border-radius:11px;font-size:14px;margin-bottom:20px;outline:none;\">\n      <div style=\"display:flex;gap:9px;justify-content:flex-end;\">\n        <button onclick=\"{{ onCloseEmail }}\" style=\"background:#fff;border:1px solid #dcdee3;color:#181a1f;border-radius:10px;padding:10px 16px;font-weight:600;font-size:13.5px;cursor:pointer;\">Cancel<\u002Fbutton>\n        <button onclick=\"{{ onSendEmail }}\" style=\"{{ sendEmailStyle }}\">Send<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ toastShow }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:60;backgroun
