 is-current', '1');\n    pages.appendChild(one);\n  }\n\n  /* -------------------------------------------------------------- states -- */\n\n  function base() {\n    $('call-consent').hidden = true;\n    $('agent-sheet').hidden = true;\n    $('session-sheet').hidden = true;\n    $('call-errorbox').hidden = true;\n    $('call-translation-status').hidden = true;\n    $('translate-pick').hidden = false;\n    $('translate-scope-pick').hidden = false;\n    $('call-remote-chan').hidden = false;\n    $('call-mute').hidden = false;\n    $('call-export').disabled = false;\n    ['call-note-privacy', 'call-note-share', 'call-note-headset', 'call-note-turns']\n      .forEach(function (id) { if ($(id)) $(id).hidden = false; });\n  }\n\n  function live(opts) {\n    const o = opts || {};\n    base();\n    $('call-start-label').textContent = 'End call';\n    $('call-start').className = 'talk recording';\n    $('call-local-dot').className = 'dot live';\n    $('call-remote-dot').className = 'dot live';\n    $('call-elapsed-label').textContent = 'Call time';\n    $('call-elapsed').textContent = '4:12';\n    $('call-export-label').textContent = 'Export call';\n    $('call-live-badge').textContent = 'Call';\n    $('call-live-badge').className = 'badge is-live';\n    $('call-status').textContent = 'Both sides connected.';\n    $('call-status').className = 'status good';\n    levels(true);\n    readout(true);\n    drawThread(o);\n    drawAssist(o.assist || {\n      agent: 'product-desk', notes: NOTES,\n      label: 'Watching · in 4s', tone: 'is-live',\n    });\n    drawCustomer(true);\n    drawChat({});\n  }\n\n  const STATES = {\n    idle: function () {\n      base();\n      $('call-start-label').textContent = 'Start call';\n      $('call-start').className = 'talk';\n      $('call-local-dot').className = 'dot';\n      $('call-remote-dot').className = 'dot';\n      $('call-elapsed-label').textContent = 'Listening for';\n      $('call-elapsed').textContent = '0:00';\n      $('call-export').disabled = true;\n      $('call-live-badge').textContent = 'Off';\n      $('call-live-badge').className = 'badge';\n      $('call-status').textContent = 'Press the button and start talking.';\n      $('call-status').className = 'status';\n      $('call-mute').hidden = true;\n      levels(false);\n      readout(false);\n      drawThread({ empty: true });\n      // Nothing chosen, so the badge names the action rather than the state:\n      // \"Off\" alone reads as something that failed to start.\n      drawAssist({ label: 'Pick an agent', tone: 'is-off' });\n      drawCustomer(false);\n      drawChat({ empty: true });\n    },\n    solo: function () {\n      live({ solo: true });\n      $('call-remote-chan').hidden = true;\n      $('translate-scope-pick').hidden = true;\n      $('call-start-label').textContent = 'Stop';\n      $('call-elapsed-label').textContent = 'Listening for';\n      $('call-export-label').textContent = 'Export text';\n      $('call-live-badge').textContent = 'Solo';\n      $('call-status').textContent = 'Listening.';\n      $('call-note-headset').hidden = true;\n      $('call-note-turns').hidden = true;\n    },\n    call: function () { live({}); },\n    translated: function () {\n      live({ translated: true, note: 'translation on \\u2014 Chinese, other side' });\n      $('call-translation-status').hidden = false;\n      $('call-translation-status').textContent = '1 sentence(s) could not be translated.';\n    },\n    /* Paused, with a check that failed behind it. Both are states of the assist\n       panel alone and neither shows up in any of the others, which is the whole\n       reason this switcher exists. */\n    assist: function () {\n      live({\n        assist: {\n          agent: 'product-desk', notes: FAILED, paused: true,\n          label: 'Paused', tone: 'is-paused',\n          say: 'Paused \\u2014 nothing is sent while paused.', sayTone: 'warn',\n        },\n      });\n    },\n    // The other panel that only fails while a call is running.\n    chat: function () {\n      live({});\n      drawChat({ say: 'That question could not be answered \\u2014 the model did not reply.', sayTone: 'warn' });\n    },\n    agent: function () { live({}); $('agent-sheet').hidden = false; },\n    consent: function () { STATES.idle(); $('call-consent').hidden = false; },\n    error: function () {\n      STATES.idle();\n      $('call-status').textContent = 'Not started \\u2014 the customer audio was not shared.';\n      $('call-status').className = 'status warn';\n      $('call-errorbox').hidden = false;\n      $('call-errorbox').textContent =\n        'Other side: NotAllowedError \\u2014 the share was dismissed before anything was picked. '\n        + 'Press Start call and choose the screen or tab the call is running in.';\n      $('call-local-dot').className = 'dot bad';\n    },\n  };\n\n  fillPickers();\n  fillAssist();\n\n  // A note's quote is a pointer into the transcript: click it and the line it\n  // came from lights up. Dismiss (×) folds one note away without clearing all.\n  $('assist-list').addEventListener('click', function (event) {\n    const done = event.target.closest('.assist-done');\n    if (done) {\n      const note = done.closest('.assist-note');\n      note.classList.add('is-leaving');\n      note.addEventListener('animationend', function () {\n        note.remove();\n        const left = $('assist-list').querySelectorAll('.assist-note').length;\n        $('assist-clear').hidden = !left;\n        $('assist-empty').hidden = !!left;\n      }, { once: true });\n      return;\n    }\n    const quote = event.target.closest('.assist-quote');\n    if (!quote) return;\n    const needle = quote.textContent.trim().toLowerCase().slice(0, 24);\n    const turns = $('call-thread').querySelectorAll('.turn');\n    const hit = Array.prototype.find.call(turns, function (turn) {\n      return turn.textContent.toLowerCase().indexOf(needle) >= 0;\n    });\n    Array.prototype.forEach.call(turns, function (turn) { turn.classList.remove('is-linked'); });\n    if (!hit) return;\n    hit.classList.add('is-linked');\n    const thread = $('call-thread');\n    thread.scrollTop = hit.offsetTop - thread.offsetTop - 12;\n    if (thread.getBoundingClientRect().top < 0) window.scrollTo({ top: window.scrollY + thread.getBoundingClientRect().top - 90, behavior: 'smooth' });\n  });\n  $('assist-list').addEventListener('keydown', function (event) {\n    if ((event.key === 'Enter' || event.key === ' ') && event.target.classList.contains('assist-quote')) {\n      event.preventDefault(); event.target.click();\n    }\n  });\n  fillAgentSheet();\n  fillAgents();\n  fillSessions();\n  $('call-translate').value = 'Chinese';\n  $('call-source').value = 'share';\n\n  const bar = $('demo-bar');\n  bar.addEventListener('click', function (event) {\n    const button = event.target.closest('button[data-state]');\n    if (!button) return;\n    Array.prototype.forEach.call(bar.querySelectorAll('button'), function (b) {\n      b.classList.toggle('on', b === button);\n    });\n    STATES[button.dataset.state]();\n  });\n\n  // Dialogs close, so they can be got out of without reloading.\n  ['call-consent-cancel', 'call-consent-go', 'agent-cancel', 'agent-save', 'agent-reset']\n    .forEach(function (id) {\n      if (!$(id)) return;\n      $(id).addEventListener('click', function () {\n        $('call-consent').hidden = true;\n        $('agent-sheet').hidden = true;\n      });\n    });\n\n  STATES.call();\n})();\n    <\u002Fscript>\n  \n<script>\n(function () {\n  var start = document.getElementById('thread-cta-start');\n  if (start) start.addEventListener('click', function () { document.getElementById('call-start').click(); });\n  function idleTiles() {\n    document.querySelectorAll('.tile').forEach(function (tile) {\n      var b = tile.querySelector('b');\n      tile.classList.toggle('is-idle', !b || b.textContent.trim() === '\\u2014' || b.textContent.trim() === '');\n    });\n  }\n  idleTiles();\n  new MutationObserver(idleTiles).observe(document.body, { subtree: true, characterData: true, childList: true });\n  var sessions = document.getElementById('panel-sessions');\n  if (sessions) sessions.addEventListener('click', function (e) {\n    if (e.target.closest('button, a, input, select')) return;\n    var row = e.target.closest('tbody tr');\n    var open = row && row.querySelector('.acts .tbtn:not(.icon)');\n    if (open) open.click();\n  });\n})();\n<\u002Fscript>\n<button class=\"assist-jump\" id=\"assist-jump\" type=\"button\" hidden=\"\">\n  <i aria-hidden=\"true\"><\u002Fi><span id=\"assist-jump-label\">New assist note<\u002Fspan>\n  <svg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14\"><\u002Fpath><path d=\"m19 12-7 7-7-7\"><\u002Fpath><\u002Fsvg>\n<\u002Fbutton>\n<script>\n(function () {\n  var $ = function (id) { return document.getElementById(id); };\n  // Before you share: open while setting up, folded once the call is running.\n  var help = $('share-help'), toggle = $('share-help-toggle'), manual = null;\n  function setHelp(open) {\n    help.classList.toggle('is-folded', !open);\n    toggle.setAttribute('aria-expanded', String(open));\n  }\n  toggle.addEventListener('click', function () { manual = help.classList.contains('is-folded'); setHelp(manual); });\n  var start = $('call-start'), wasLive = null;\n  function syncLive() {\n    var live = start.classList.contains('recording');\n    if (live !== wasLive) { wasLive = live; manual = null; setHelp(!live); }\n  }\n  new MutationObserver(syncLive).observe(start, { attributes: true, attributeFilter: ['class'] });\n  syncLive();\n\n  // Live assist off-screen: a pill says how many notes arrived and takes you there.\n  var panel = $('assist-panel') || $('assist-list').closest('.card');\n  var list = $('assist-list'), jump = $('assist-jump'), label = $('assist-jump-label');\n  var visible = true, seen = 0;\n  function count() { return list.querySelectorAll('.assist-note').length; }\n  function sync() {\n    var n = count();\n    if (visible || n < seen) seen = n;\n    var fresh = n - seen;\n    jump.hidden = visible || fresh <= 0 || !panel.offsetParent;\n    label.textContent = fresh === 1 ? '1 new assist note' : fresh + ' new assist notes';\n  }\n  new IntersectionObserver(function (e) { visible = e[0].isIntersecting; sync(); }, { threshold: 0.25 }).observe(panel);\n  new MutationObserver(sync).observe(list, { childList: true });\n  var view = panel.closest('.panel');\n  if (view) new MutationObserver(sync).observe(view, { attributes: true, attributeFilter: ['class', 'hidden'] });\n  jump.addEventListener('click', function () {\n    window.scrollTo({ top: panel.getBoundingClientRect().top + window.scrollY - 72, behavior: 'smooth' });\n  });\n  window.__assistJumpDemo = function () { visible = false; seen = Math.max(0, count() - 2); sync(); };\n})();\n<\u002Fscript>\n<script>\n(function () {\n  var $ = function (id) { return document.getElementById(id); };\n\n  // Header pickers size to their longest option, so labels never truncate.\n  var ctx = document.createElement('canvas').getContext('2d');\n  function fit(sel) {\n    if (!sel.options.length || !sel.offsetParent) return;\n    var cs = getComputedStyle(sel);\n    ctx.font = cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;\n    var w = 0;\n    for (var i = 0; i < sel.options.length; i++) w = Math.max(w, ctx.measureText(sel.options[i].text).width);\n    sel.style.width = Math.ceil(w + parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) + 4) + 'px';\n  }\n  function fitAll() { document.querySelectorAll('.head-picks select').forEach(fit); }\n  document.querySelectorAll('.head-picks select').forEach(function (s) {\n    new MutationObserver(function () { fit(s); }).observe(s, { childList: true });\n  });\n  document.querySelectorAll('.mode').forEach(function (m) { m.addEventListener('click', function () { setTimeout(fitAll, 0); }); });\n  fitAll();\n\n  // Demo only: the speaker list is filled by the server in the app.\n  var sp = $('tts-speaker');\n  if (sp && !sp.options.length) ['Serena \\u2014 English', 'Wei \\u2014 Mandarin', 'Aisha \\u2014 Malay', 'Kit \\u2014 Cantonese'].forEach(function (n) { sp.add(new Option(n)); });\n\n  // Delete a session → it goes at once, with a few seconds to take it back.\n  var toast = document.createElement('div');\n  toast.className = 'undo-toast'; toast.hidden = true; toast.setAttribute('role', 'status');\n  toast.innerHTML = '<span id=\"undo-text\">Session deleted<\u002Fspan><button type=\"button\" id=\"undo-btn\">Undo<\u002Fbutton>';\n  document.body.appendChild(toast);\n  var pending = null, timer = 0;\n  function recount(d) {\n    var head = sessions && sessions.querySelector('.card-head .badge');\n    if (head) head.textContent = head.textContent.replace(/\\d+/, function (n) { return Math.max(0, +n + d); });\n    var foot = Array.prototype.find.call(sessions ? sessions.querySelectorAll('*') : [], function (el) { return !el.children.length && /^Showing /.test(el.textContent.trim()); });\n    if (foot) { var i = 0; foot.textContent = foot.textContent.replace(/\\d+/g, function (n) { i++; return i === 1 ? n : Math.max(0, +n + d); }); }\n  }\n  function settle() { pending = null; toast.hidden = true; }\n  $('undo-btn').addEventListener('click', function () {\n    if (!pending) return;\n    pending.parent.insertBefore(pending.row, pending.next);\n    pending.row.classList.add('is-restored');\n    recount(1);\n    clearTimeout(timer); settle();\n  });\n  var sessions = $('panel-sessions');\n  if (sessions) sessions.addEventListener('click', function (e) {\n    var del = e.target.closest('tbody .acts .tbtn.icon');\n    if (!del) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    var row = del.closest('tr');\n    pending = { row: row, parent: row.parentNode, next: row.nextSibling };\n    $('undo-text').textContent = (row.cells[0] ? row.cells[0].textContent.trim() + ' \\u00b7 ' : '') + 'session deleted';\n    row.remove();\n    recount(-1);\n    toast.hidden = false;\n    clearTimeout(timer); timer = setTimeout(settle, 6000);\n  }, true);\n\n  // Keyboard: Enter on a focused row opens it.\n  if (sessions) sessions.addEventListener('keydown', function (e) {\n    var row = e.target.closest && e.target.closest('tbody tr');\n    if (row && e.target === row && e.key === 'Enter') { var o = row.querySelector('.acts .tbtn:not(.icon)'); if (o) o.click(); }\n  });\n  function tabRows() { if (sessions) sessions.querySelectorAll('tbody tr').forEach(function (r) { r.tabIndex = 0; }); }\n  tabRows();\n  var tb = sessions && sessions.querySelector('tbody');\n  if (tb) new MutationObserver(tabRows).observe(tb, { childList: true });\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
