  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

7d7979;\n  --n700: #605d5d;\n  --n800: #444141;\n  --n900: #2d2b2b;\n\n  --a100: #fff2ef;\n  --a200: #ffe0d9;\n  --a300: #ffc4b8;\n  --a400: #ff9783;\n  --a500: #ff563c;\n  --a600: #dd2b0f;\n  --a700: #ae1800;\n  --a800: #7c1405;\n  --a900: #4d170e;\n  --accent: #ec3013;\n\n  /* Translated text, and the only second colour in the palette.\n   *\n   * The red accent is spoken for: it marks the local speaker and the guard's\n   * findings, both of which mean \"look at this\". A translation means the\n   * opposite — it is the same words again, for a reader who needs them — so it\n   * cannot borrow that, and grey would read as provisional, which is the one\n   * thing a translation here never is. */\n  --translated: #3a4fa8;\n\n  /* Two more ramps, for the assist panel's three kinds of note: green for an\n     insight, the accent above for a correction, amber for service feedback.\n     Named as ramps rather than as roles because they are built the same way as\n     --a: the same lightness steps (97/93/58/48), hue and chroma only.\n\n     Chroma is at the sRGB gamut edge for these hues at these lightnesses, not\n     matched to --a's. Matching it would put green and amber outside the gamut\n     and leave the browser to clip them — which it does per channel, so the hue\n     lands wherever the clipping puts it and the \"one ramp per role\" property\n     these are here to have is the first thing lost. */\n  --g100: oklch(97% 0.020 150);\n  --g200: oklch(93% 0.045 150);\n  --g600: oklch(58% 0.130 150);\n  --g700: oklch(48% 0.110 150);\n\n  /* Hue 70 rather than a true yellow: amber has to be told apart from the red\n     at a glance and in peripheral vision, and it is the one pair on this page\n     where that reading is load-bearing. */\n  --y100: oklch(97% 0.021 70);\n  --y200: oklch(93% 0.050 70);\n  --y600: oklch(58% 0.121 70);\n  --y700: oklch(48% 0.100 70);\n\n  --paper: var(--bg);\n  --surface: var(--n100);\n  --graphite: var(--n600);\n  --quiet: var(--n500);\n  --hair: var(--n200);\n  --rule: var(--n300);\n  --tick: var(--n300);\n\n  --r: 10px;\n  --r-sm: 6px;\n  --r-pill: 999px;\n\n  --sans: \"Archivo\", -apple-system, \"SF Pro Text\", \"Segoe UI\", system-ui, sans-serif;\n  --mono: ui-monospace, \"SF Mono\", Menlo, monospace;\n\n  --shadow-sm: 0 1px 2px color-mix(in srgb, var(--n900) 14%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, var(--n900) 22%, transparent);\n\n  /* The two panes the user can drag, held here so the grip handlers move one\n     number each and every rule that depends on a width reads the same one. */\n  --rail-w: 300px;\n  --mid-w: 360px;\n  --thread-h: 460px;\n  --compose-h: 200px;\n  --side-w: 220px;\n}\n\n* { box-sizing: border-box; }\n\nhtml { background: var(--bg); }\n\nbody {\n  margin: 0;\n  background: var(--bg);\n  color: var(--ink);\n  font-family: var(--sans);\n  font-size: 12px;\n  line-height: 1.45;\n  -webkit-font-smoothing: antialiased;\n}\n\nh1, h2, h3 { font-size: 13px; font-weight: 600; letter-spacing: 0; margin: 0; }\n\n::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); }\n\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }\n\nselect, textarea, input, button { font-family: inherit; color: var(--ink); }\n\n.sr-only {\n  position: absolute; width: 1px; height: 1px; margin: -1px;\n  padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;\n}\n\n@keyframes va-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }\n@keyframes va-ring {\n  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); }\n  100% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--accent) 0%, transparent); }\n}\n\n/* ──────────────────────────────────────────────────────────────── shell ── */\n\n.shell { min-height: 100vh; }\n\n/* The rail is open or closed, and ONE class on <body> says which.\n *\n * It was the element's own `hidden` attribute, which meant two mechanisms had\n * to agree: `.side[hidden]` had to out-specify `.side { display: flex }`, and\n * the body class had to move the column beside it. Two rules, two places to be\n * wrong, and a browser where the rail stayed put while the content moved — or\n * did not move at all — looks exactly like a dead button.\n *\n * Now the class is the whole state. Both halves of the change hang off it, the\n * narrow-window overlay below reads the same class, and nothing depends on an\n * attribute out-ranking a declaration on the same element. */\n.side {\n  position: fixed; inset: 0 auto 0 0; width: var(--side-w); z-index: 20;\n  display: flex; flex-direction: column;\n  background: var(--card); border-right: 1px solid var(--n200);\n}\nbody.side-closed .side { display: none; }\n\n.main {\n  margin-left: var(--side-w); min-height: 100vh;\n  display: flex; flex-direction: column;\n  transition: margin-left .2s;\n}\nbody.side-closed .main { margin-left: 0; }\n\n.brand {\n  display: flex; align-items: center; gap: 10px;\n  height: 56px; padding: 0 16px; border-bottom: 1px solid var(--n200);\n}\n.brand .logo, .head-brand .logo { display: block; height: 20px; width: auto; }\n.head-brand .logo { height: 18px; }\n.brand-rule { width: 1px; height: 16px; background: var(--n300); }\n.brand h1 { font-size: 14px; }\n\n.side-nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }\n\n.side-group {\n  padding: 6px 10px 4px; font-size: 10px; font-weight: 600;\n  color: var(--n500); text-transform: uppercase; letter-spacing: .04em;\n}\n.side-group + .side-group,\n.mode + .side-group { padding-top: 14px; }\n\n/* A destination, not a tab. Same element in the sidebar for all four views, so\n   the one that is current is the only one that carries a ground. */\n.mode {\n  display: flex; align-items: center; gap: 10px;\n  height: 34px; padding: 0 10px; width: 100%;\n  border: 0; border-radius: 8px; background: transparent;\n  font-size: 13px; font-weight: 500; color: var(--n800);\n  text-align: left; cursor: pointer; transition: background .15s, color .15s;\n}\n.mode:hover { background: var(--n100); }\n.mode.is-active { background: var(--n200); color: var(--ink); }\n.mode svg { flex: none; }\n\n.side-live {\n  margin-left: auto; width: 7px; height: 7px; border-radius: 50%;\n  background: var(--accent); animation: va-pulse 1.4s infinite;\n}\n.side-live[hidden] { display: none; }\n\n.side-foot {\n  margin-top: auto; display: flex; align-items: center; gap: 10px;\n  padding: 12px 16px; border-top: 1px solid var(--n200);\n}\n.avatar {\n  flex: none; display: grid; place-items: center; width: 30px; height: 30px;\n  border-radius: 50%; background: var(--accent); color: #fff;\n  font-size: 11px; font-weight: 600; letter-spacing: .02em;\n}\n.who {\n  font-size: 12px; font-weight: 600; min-width: 0;\n  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\n}\n\n/* Indicators. One shape, one size, everywhere on the page: the meaning is in\n   the colour and in whether it moves. */\n.dot {\n  flex: none; display: inline-block; width: 7px; height: 7px; border-radius: 50%;\n  background: var(--n400);\n}\n.dot.good { background: #2f8f4e; }\n.dot.live { background: var(--accent); animation: va-pulse 1.4s infinite; }\n.dot.connecting { background: var(--n500); animation: va-pulse 1s infinite; }\n.dot.warn { background: #c9861d; }\n.dot.bad { background: var(--accent); }\n.dot.muted { background: var(--n700); }\n\n/* ────────────────────────────────────────────────────────────── top bar ── */\n\n.head {\n  position: sticky; top: 0; z-index: 10;\n  display: flex; align-items: center; gap: 10px;\n  height: 56px; padding: 0 20px; white-space: nowrap;\n  background: var(--card); border-bottom: 1px solid var(--n200);\n}\n\n.icon-btn {\n  flex: none; display: grid; place-items: center;\n  width: 34px; height: 34px; padding: 0;\n  border: 1px solid var(--n300); border-radius: 8px;\n  background: var(--card); color: var(--n700); cursor: pointer;\n}\n.icon-btn:hover { background: var(--n100); }\n.icon-btn:disabled { opacity: .45; cursor: not-allowed; }\n\n.head-brand {\n  display: flex; align-items: center; gap: 10px; flex: none;\n  font-size: 14px; font-weight: 600;\n}\n.head-brand[hidden] { display: none; }\n\n.search {\n  display: flex; align-items: center; gap: 8px;\n  flex: 1 1 120px; min-width: 0; max-width: 380px; height: 34px; padding: 0 10px;\n  border: 1px solid var(--n200); border-radius: 8px;\n  background: var(--n100); color: var(--n600);\n}\n.search svg { flex: none; }\n.search input {\n  flex: 1; min-width: 0; border: 0; background: transparent;\n  font-size: 12px; color: var(--ink); outline: none;\n}\n.search input::-webkit-search-cancel-button { cursor: pointer; }\n\n.head-gap { margin-left: auto; }\n.head-acts { display: flex; align-items: center; gap: 8px; }\n.head-acts[hidden] { display: none; }\n\n/* — the two buttons that start and stop something — */\n.talk {\n  display: inline-flex; align-items: center; gap: 8px; flex: none;\n  height: 34px; padding: 0 14px 0 10px; border: 0; border-radius: 8px;\n  font-size: 12px; font-weight: 600; color: #fff; background: var(--accent);\n  cursor: pointer; transition: background .2s, transform .1s;\n}\n.talk:hover { background: var(--a600); }\n.talk:active { transform: scale(.97); }\n.talk:disabled { opacity: .55; cursor: not-allowed; }\n/* Recording is the one state where the button means \"stop\", so it stops being\n   the colour that means \"go\". */\n.talk.recording { background: var(--n900); }\n.talk.recording:hover { background: var(--n800); }\n.talk-mic {\n  display: grid; place-items: center; width: 20px; height: 20px;\n  border-radius: 50%; background: rgba(255, 255, 255, .2);\n}\n.talk.recording .talk-mic { animation: va-ring 1.6s infinite; }\n#call-elapsed { font-weight: 500; opacity: .85; font-variant-numeric: tabular-nums; }\n.talk:not(.recording) #call-elapsed { display: none; }\n\n.plain, .export {\n  display: inline-flex; align-items: center; gap: 6px; flex: none;\n  height: 34px; padding: 0 12px; border-radius: 8px;\n  border: 1px solid var(--n300); background: var(--card);\n  font-size: 12px; font-weight: 600; cursor: pointer;\n}\n.plain:hover, .export:hover:not(:disabled) { background: var(--n100); }\n.plain:disabled, .export:disabled { opacity: .45; cursor: not-allowed; }\n.plain.danger { border-color: transparent; color: var(--a700); }\n.plain.danger:hover { background: var(--a100); }\n.stop-square { width: 9px; height: 9px; border-radius: 2px; background: currentColor; }\n/* Resume is the same button with the other meaning, so it takes the other\n   shape: a square says stop everywhere, a triangle says play everywhere, and\n   the word beside it should not be the only thing carrying that. */\n.is-resume .stop-square {\n  width: 0; height: 0; border-radius: 0; background: transparent;\n  border-left: 9px solid currentColor;\n  border-top: 5px solid transparent;\n  border-bottom: 5px solid transparent;\n}\n\n/* ───────────────────────────────────────────────────────────────  panels ── */\n\n/* One <main> landmark holding four regions, only ever one of them shown. The\n   rail is navigation, not a tablist — these are places, not panes of one\n   thing — so the panels are regions labelled by the link that reaches them. */\n.views { flex: 1; display: flex; flex-direction: column; }\n.panel { flex: 1; display: none; flex-direction: column; gap: 14px; padding: 16px 20px 24px; }\n.panel.is-active { display: flex; }\n\n.page-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }\n.page-head h2 { font-size: 16px; }\n.page-head span { font-size: 12px; color: var(--n600); }\n\n/* — the figures across the top — */\n.readout { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }\n.tile {\n  display: flex; flex-direction: column; gap: 1px; padding: 8px 12px;\n  background: var(--card); border: 1px solid var(--n200); border-radius: var(--r);\n  min-width: 0;\n}\n.tile > span { font-size: 11px; font-weight: 500; color: var(--n600); white-space: nowrap; }\n.tile > b {\n  font-size: 16px; font-weight: 600; line-height: 1.2;\n  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\n  font-variant-numeric: tabular-nums;\n}\n.tile > em { font-style: normal; font-size: 10px; color: var(--n500); }\n/* Behind, not broken. The one readout that changes colour, because it is the\n   one that answers \"has it stopped?\" with \"no, it is catching up\". */\n.tile > b.lagging, .tile > b.over { color: var(--a700); }\n\n/* — the resizable two-column body — */\n.split {\n  display: grid; align-items: start;\n  grid-template-columns: minmax(0, 1fr) 14px var(--rail-w);\n}\n.col, .rail, .mid { display: flex; flex-direction: column; min-width: 0; }\n.col { gap: 8px; }\n.rail, .mid { gap: 14px; }\n\n/* The two panels that are read together are one height.\n * ==================================================\n * On the CARDS, not on the scrollers inside them. It was on the scrollers, which\n * looked equivalent and is not: the assist header is two rows to the transcript's\n * one, so equal scrollers gave unequal cards and the transcript finished higher up\n * the page. Reported as \"the transcript window is shorter than the assist window\".\n *\n * With the height here and `flex: 1` on each scroller, each panel gives its header\n * whatever it needs and the scroller takes the rest — so the two line up whatever\n * either header grows into later.\n *\n * The caption below the transcript is outside its card and stays there. It is a\n * note ABOUT the panel rather than part of it, and the cards are what the eye\n * lines up. */\n.transcript, .assist { height: var(--thread-h); min-height: 240px; }\n/* Handles keep their own size inside a card that now has one. */\n.grip-row { flex: 0 0 auto; }\n\n/* Three columns: the words, what is being said about them, and the controls.\n *\n * The assist panel lived in the rail, below the audio controls and the customer\n * card, which put it far enough down that the transcript and the notes about the\n * transcript could not be read at the same time — and being glanceable while\n * somebody talks is the whole of what that panel is for. A column of its own is\n * the fix: the two things the reader alternates between are side by side, and the\n * things you set before a call are no longer between them. */\n.split.is-three {\n  grid-template-columns: minmax(0, 1fr) 14px var(--mid-w) 14px var(--rail-w);\n}\n\n/* The transcript column keeps its header even when it is squeezed away.\n * ==================================================\n * Widening the assist column takes the transcript's track to zero, which is what\n * replaced the Hide button — and the transcript card's HEAD carries the spoken\n * language and the translation target. So \"give the assist the room\" also took\n * away the two controls that configure the call, silently, and the width is\n * remembered, so it stayed away across reloads.\n *\n * Reported as \"translation does not show\", which it did not, because there was\n * nowhere left to choose a target.\n *\n * So the track can shrink to a header and no further. That still hides the words —\n * which is what it is for — while leaving the controls reachable. The number is the\n * narrowest a picker wraps into rather than a round guess; the head wraps, so a\n * third one (translation scope, moved up from the rail) stacks rather than\n * squeezing the other two off the end. */\n.split.is-three > .col { min-width: 148px; }\n\n/* Every child pinned to its own track, and this is not belt-and-braces.\n * ==================================================\n * The grid was relying on AUTO-PLACEMENT — five children falling into five\n * tracks in document order — and the rule below used to hide the middle grip with\n * `display: none`. A display:none child is not in the grid at all, so the four\n * that remained shifted up one track each and the rail landed on a zero-width\n * one: move the assist panel to the right and the entire right-hand column\n * disappeared. Reported, correctly, as the UI being wrecked.\n *\n * Auto-placement is the wrong mechanism for a layout whose children can be\n * hidden, and cards here can be hidden by the server (the assist and chat panels\n * wait to be told the deployment can run them) as well as by a person. Pinned,\n * the tracks mean the same thing however many children are present. */\n.split.is-three > .col { grid-column: 1; }\n.split.is-three > #mid-grip { grid-column: 2; }\n.split.is-three > .mid { grid-column: 3; }\n.split.is-three > #split-grip { grid-column: 4; }\n.split.is-three > .rail { grid-column: 5; }\n\n/* Empty, the middle column and its grip give their width back.\n *\n * Reachable by dragging every card out of it, which is a thing somebody will do —\n * and a 360px gutter of nothing between two columns reads as a rendering fault\n * rather than as a column you emptied.\n *\n * Zero WIDTH rather than display:none, now that the tracks are pinned: the grip\n * keeps its place in the grid and simply has no room, which is the same thing to\n * look at and cannot renumber anything. Tracks 2 and 3 are the grip and the\n * column; track 4 is the rail's own grip and keeps its 14px. */\n/* `:not(.is-moving)` is what makes a drag able to re-open this, and it is written\n * as an exclusion rather than as a second rule that tries to out-rank this one.\n * ==================================================\n * It WAS a second rule — `.split.is-three.is-moving` restoring the widths — and it\n * silently lost: `:not(:has(.mid > *:not([hidden])))` carries the specificity of\n * its argument, so this selector is (0,4,0) against that one's (0,3,0). The\n * collapsed column stayed collapsed for the whole drag, and a column with no width\n * is not something a pointer can reach — so moving the last card out of the middle\n * became a one-way trip, while Alt+Left kept working. That asymmetry is what reads\n * as the drag being broken.\n *\n * Two rules competing over one property is the thing to avoid, not the thing to\n * tune. Mutually exclusive selectors cannot be got wrong by arithmetic: while a\n * card is in flight this does not match at all, and the plain `.split.is-three`\n * rule above gives the full five tracks. */\n.split.is-three:not(.is-moving):not(:has(.mid > .card:not([hidden]))) {\n  grid-template-columns: minmax(0, 1fr) 0 0 14px var(--rail-w);\n}\n/* A handle with no column behind it must not still be grabbable. Same exclusion,\n   so the grip comes back with the column it resizes. */\n.split.is-three:not(.is-moving):not(:has(.mid > .card:not([hidden]))) > #mid-grip {\n  visibility: hidden; pointer-events: none;\n}\n\n/* A column being dragged into has a HEIGHT, unconditionally.\n * ==================================================\n * This is the bug that made an empty middle column impossible to drop onto even\n * though the gap was plainly there. The height used to be conditional on the\n * column being empty — and the drop indicator this file inserts on `dragover` is\n * a child, so arriving with the pointer made the column non-empty, which removed\n * the height, which took the column out from under the pointer, which fired\n * `dragleave` and removed the indicator again. The target destroyed itself once\n * per frame and `drop` never fired. What was visible was the column's WIDTH; its\n * height was gone.\n *\n * So the height is not conditional on anything, and every \"is this column empty\"\n * test in this file now asks about `.card` children rather than any child. The\n * indicator is not a card, so it cannot change the answer to a question about\n * where cards are — which is the only property any of these rules is actually\n * interested in. */\n.split.is-three.is-moving > .mid { min-height: 84px; }\n\n/* Empty and awaiting a drop: say so, rather than being a blank space that happens\n   to accept one. */\n.split.is-three.is-moving > .mid:not(:has(> .card:not([hidden]))) {\n  outline: 2px dashed var(--n400); outline-offset: 0; border-radius: var(--r);\n}\n\n/* — dragging a card between columns — */\n\n/* The header is the handle, which is the convention for a draggable panel and\n   the reason the card itself is not draggable: `draggable` on the card would make\n   selecting the text inside it a drag instead of a selection. */\n.card-head[draggable='true'] { cursor: grab; }\n.card-head[draggable='true']:active { cursor: grabbing; }\n.card.is-dragging { opacity: .4; }\n\n/* The column being dragged over. Deliberately a ring rather than a fill: a filled\n   column hides the cards already in it at the moment you are deciding where among\n   them this one goes. */\n.mid.is-drop, .rail.is-drop {\n  outline: 2px dashed var(--a400); outline-offset: 5px; border-radius: var(--r);\n}\n\n/* Where it would land. One line, drawn between cards, because the question being\n   answered is \"above this one or below it\" and a line is the shape of that\n   answer. */\n.drop-line {\n  height: 2px; margin: -8px 0; border-radius: 2px; background: var(--accent);\n}\n\n/* A handle that draws nothing and holds a row of its own.\n *\n * It drew a grabber bar for a while, on the theory that an invisible handle\n * cannot be found. That theory was wrong about the actual problem — the fix\n * was a cache directive, not paint — and the bars turned out to be a second\n * line beside a card edge that already draws one. The resize cursor is the\n * affordance, which is the convention everywhere else a pane can be dragged.\n *\n * What is kept from that round is the part that mattered: real space in the\n * layout. These used to sit on a negative margin, straddling the border of the\n * card above them, which made a ten-pixel strip that was reachable in principle\n * and not in practice. touch-action keeps a drag from being read as a scroll. */\n.grip { user-select: none; touch-action: none; }\n.grip-col { align-self: stretch; width: 14px; cursor: ew-resize; }\n.grip-row { height: 10px; cursor: ns-resize; }\n\n/* ───────────────────────────────────────────────────────────────── cards ── */\n\n/* Clipped to its own corners.\n *\n * Several cards end on a child that paints to the edge — the transcript's grey\n * footnote, the last row of a table under the pointer, the guard's disclaimer —\n * and a square background inside a rounded box fills the corner the box is\n * trying to round off. Giving each of those its own radius is the fiddly\n * version of this and gets the arithmetic wrong by a pixel every time: the\n * inner radius wanted is the outer one MINUS the border, and using the outer\n * value leaves the child bleeding a hair past the curve. Clipping the parent\n * settles it for every child, including the ones added later.\n *\n * Nothing in a card needs to escape it. The selects open native popups, which\n * are not laid out in the document, and every dialog is a fixed element of its\n * own outside this tree. */\n.card {\n  display: flex; flex-direction: column; min-width: 0; overflow: hidden;\n  background: var(--card); border: 1px solid var(--n200); border-radius: var(--r);\n}\n.card-head {\n  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;\n  min-height: 44px; padding: 8px 14px; border-bottom: 1px solid var(--n200);\n}\n.card-head h2 { flex: none; }\n.head-picks { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; max-width: 100%; }\n.head-count { margin-left: auto; font-size: 11px; color: var(--n600); }\n\n.badge {\n  flex: none; padding: 1px 7px; border-radius: var(--r-pill);\n  font-size: 10px; font-weight: 600; background: var(--n200); color: var(--n700);\n  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px;\n}\n.badge.is-live { background: var(--n900); color: #fff; }\n\n/* — form controls — */\nselect, .field input, .search input { font-size: 12px; }\n\n.card-head select, .head-picks select {\n  height: 28px; max-width: 100%; min-width: 0; padding: 0 8px;\n  background: var(--n100); border: 1px solid var(--n300); border-radius: var(--r-sm);\n}\n\n.field { display: block; padding: 0 14px; }\n.field > span {\n  display: block; font-size: 11px; font-weight: 500; color: var(--n600); margin-bottom: 3px;\n}\n.field select, .field input {\n  display: block; width: 100%; height: 30px; padding: 0 8px;\n  background: var(--n100); border: 1px solid var(--n300); border-radius: var(--r-sm);\n}\n.field textarea {\n  display: block; width: 100%; padding: 10px; font-size: 12px; line-height: 1.5;\n  background: var(--n100); border: 1px solid var(--n300); border-radius: var(--r-sm);\n  resize: vertical;\n}\n.field[hidden] { display: none; }\n\n.rule { height: 1px; margin: 12px 14px 2px; background: var(--n200); }\n\n/* An asterisk that explains its own field.\n *\n * A bubble rather than a title attribute, for the one reason that matters\n * here: a native tooltip takes about a second to appear, and a second is long\n * enough that somebody puzzled by a control has already moved on. Focusable as\n * well as hoverable, since the thing it explains is reachable by keyboard and\n * an explanation that is not would be worse than none. */\n.hint {\n  position: relative; margin-left: 3px; cursor: help;\n  color: var(--accent); font-weight: 600;\n}\n.hint-bubble {\n  position: absolute; left: -4px; top: calc(100% + 7px); z-index: 5;\n  width: 250px; padding: 9px 11px; border-radius: var(--r-sm);\n  background: var(--n900); color: #fff;\n  font-size: 11px; font-weight: 400; line-height: 1.55; letter-spacing: 0;\n  box-shadow: var(--shadow-lg);\n  opacity: 0; visibility: hidden; transition: opacity .12s;\n}\n.hint-bubble b { font-weight: 600; }\n.hint-bubble i { font-style: normal; color: var(--a300); }\n.hint:hover .hint-bubble,\n.hint:focus-visible .hint-bubble { opacity: 1; visibility: visible; }\n\n/* The one card allowed out of its own corners, because the only thing that\n   leaves is a tooltip — and a tooltip clipped to the box it explains is a\n   tooltip nobody can read. Nothing in this card paints to an edge, which is\n   what the clip is there for everywhere else. */\n.controls { overflow: visible; }\n\n/* — the status line, which is a pill that is allowed to be a sentence — */\n.status {\n  display: inline-flex; align-items: baseline; gap: 6px; margin: 0;\n  padding: 3px 9px; border-radius: var(--r-pill);\n  font-size: 11px; font-weight: 600; color: var(--n700); background: var(--n200);\n  white-space: normal;\n}\n.status::before {\n  content: ''; flex: none; align-self: center;\n  width: 6px; height: 6px; border-radius: 50%; background: currentColor;\n}\n.status.good { color: var(--a800); background: var(--a100); }\n.status.good::before { animation: va-pulse 1.4s infinite; }\n.status.warn { color: #7a5407; background: #fdf3e0; }\n.status.bad { color: var(--a900); background: var(--a200); }\n\n/* ──────────────────────────────────────────────────────────── transcript ── */\n\n.transcript { position: relative; }\n\n.thread {\n  /* Absorbs whatever the header above it leaves. The HEIGHT is on the card now —\n     see the rule pairing the two panels — and putting it here instead was the bug:\n     two cards whose scrollers matched but whose headers did not ended up different\n     heights, and the assist head is two rows to the transcript's one. Flexing the\n     scroller makes the difference disappear wherever it comes from. */\n  flex: 1 1 auto; height: auto; min-height: 0; overflow: auto;\n  padding: 8px 14px 12px; display: flex; flex-direction: column; gap: 2px;\n}\n.thread.empty {\n  display: grid; place-items: center; padding: 24px; text-align: center;\n  font-size: 12px; color: var(--n600);\n}\n/* A caption, under the card it is about rather than inside it.\n *\n * Both of these used to be a grey band across the foot of their box, which made\n * them read as another pane of the thing above — a second section of the\n * transcript, a second part of the compose area — when what they are is a note\n * about it. Outside, on the panel's own ground, the box ends where it ends. */\n/* Exactly as wide as the card it is under.\n *\n * It carried a 78ch measure, which is the right instinct for a column of prose\n * and the wrong one here: a caption that stops short of the box it describes\n * does not read as comfortable line length, it reads as misalignment. The box\n * above sets the width; this follows it. */\n.caption {\n  margin: 0; font-size: 11px; line-height: 1.5; color: var(--n600);\n}\n\n/* A turn is a flat row — avatar, bubble, then any translation — and the\n   translation is pushed onto its own line by flex-basis rather than by being\n   nested in a column. Flat because call.js addresses the children by position:\n   who is [0] and the words are [1], and a wrapper for the look would have been\n   a wrapper the client had to learn about. */\n.turn {\n  display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; padding: 5px 0;\n}\n.turn.is-local { flex-direction: row-reverse; }\n\n.turn-who {\n  flex: none; display: grid; place-items: center;\n  width: 26px; height: 26px; border-radius: 50%;\n  font-size: 9px; font-weight: 600; letter-spacing: -.01em;\n  background: var(--n200); color: var(--n800);\n}\n.turn.is-local .turn-who { background: var(--accent); color: #fff; }\n/* A long turn broken into sections: the same speaker, still going.\n *\n * The avatar fades rather than disappearing. Removing it would align the bubble\n * under the one above and read as one block again — which is the thing being\n * fixed — and keeping it at full strength reads as the floor having changed hands\n * and come straight back. Faded says \"same person, next paragraph\", and the\n * tighter gap above says the two belong together. */\n.turn.is-continued { margin-top: -4px; }\n.turn.is-continued .turn-who { opacity: .32; }\n\n/* Ringing only while this side is still being written into. */\n.turn.is-local.is-open .turn-who { animation: va-ring 1.6s infinite; }\n\n.turn-said {\n  margin: 0; max-width: 78%; padding: 7px 11px;\n  border-radius: 12px 12px 12px 3px; background: var(--n100);\n  font-size: 13px; line-height: 1.5; text-wrap: pretty;\n}\n.turn.is-local .turn-said {\n  border-radius: 12px 12px 3px 12px; background: var(--a100);\n}\n/* The live segment, drawn as what it is: still being decided. */\n.turn.is-open .turn-said { border: 1px dashed var(--a300); }\n.turn.is-remote.is-open .turn-said { border-color: var(--n300); }\n.settled { color: inherit; }\n.provisional { color: var(--n500); }\n\n/* Under the words it translates, in its own colour. Not drawn as provisional:\n   only complete sentences are sent. A line can still be corrected once, if the\n   recogniser rewrote the sentence after it went out. */\n.turn-translated {\n  flex-basis: 100%; max-width: 78%; margin: 1px 0 0; padding: 5px 9px;\n  border: 1px solid var(--n200); border-radius: 10px;\n  background: var(--card); color: var(--translated);\n  font-size: 12px; line-height: 1.5;\n}\n/* The wrapped line lays out from whichever edge its row started at, so only\n   the left-aligned side needs pushing over. */\n.turn.is-local .turn-translated { margin-left: auto; }\n.turn-translated.is-pending { color: var(--n500); letter-spacing: .2em; }\n\n/* Not a turn: it belongs to no channel and holds no transcript. Centred so it\n   reads as something that happened to the session rather than in it. */\n.turn-note {\n  align-self: center; margin: 3px 0; padding: 1px 8px; border-radius: var(--r-pill);\n  background: var(--n200); font-size: 10px; font-weight: 500; color: var(--n700);\n}\n\n.translation-status {\n  margin: 10px 14px 0; padding: 6px 10px; border-radius: var(--r-sm);\n  font-size: 11px; color: var(--a800); background: var(--a100);\n}\n.translation-status[hidden] { display: none; }\n\n/* ───────────────────────────────────────────────────────────────  errors ── */\n\n.error {\n  margin: 10px 14px 0; padding: 10px 12px; border-radius: var(--r-sm);\n  font-size: 12px; line-height: 1.5; color: var(--a900);\n  background: var(--a100); border: 1px solid var(--a300);\n}\n.error[hidden] { display: none; }\n.error strong { display: block; font-weight: 600; margin-bottom: 2px; }\n.error p { margin: 4px 0 0; }\n.error code {\n  display: inline-block; margin-top: 4px; padding: 1px 5px; border-radius: 4px;\n  font-family: var(--mono); font-size: 11px; background: var(--a200);\n}\n.error .plain { height: 28px; margin: 8px 6px 0 0; font-size: 11px; background: var(--card); }\n\n/* ──────────────────────────────────────────────────────────── transport ── */\n\n.transport { padding-bottom: 12px; }\n.transport .readouts {\n  display: flex; flex-direction: column; gap: 8px; padding: 12px 14px 10px;\n}\n.chan { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 8px; align-items: center; }\n.chan[hidden] { display: none; }\n.chan-head {\n  display: flex; align-items: center; gap: 6px;\n  font-size: 12px; font-weight: 500; white-space: nowrap;\n}\n.level { display: grid; grid-template-columns: repeat(12, 1fr); gap: 2px; height: 8px; }\n.level i { display: block; border-radius: 1px; background: var(--tick); transition: background .15s; }\n.level i.on { background: var(--ink); }\n.level i.peak { background: var(--accent); }\n\n.field + .field { margin-top: 10px; }\n\n/* — the switch rows — */\n.srow {\n  display: flex; align-items: center; justify-content: space-between; gap: 10px;\n  padding: 6px 14px; cursor: pointer;\n}\n.srow > span { display: flex; flex-direction: column; font-size: 12px; font-weight: 500; }\n.srow em { font-style: normal; font-size: 11px; font-weight: 400; color: var(--n600); }\n\n.switch {\n  position: relative; flex: none; width: 34px; height: 20px; padding: 0;\n  border: 0; border-radius: var(--r-pill); background: var(--n300);\n  cursor: pointer; transition: background .2s;\n}\n.switch > i {\n  position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;\n  border-radius: 50%; background: #fff; box-shadow: var(--shadow-sm);\n  transition: left .2s;\n}\n.switch[aria-pressed='true'] { background: var(--accent); }\n.switch[aria-pressed='true'] > i { left: 16px; }\n.switch:disabled { opacity: .45; cursor: not-allowed; }\n\n/* The mute button is hidden between sessions — there is nothing to withhold\n   from a call that has not started — and the label it belongs to goes with it\n   rather than standing there over an empty space. */\n#row-mute:has(.mute[hidden]) { display: none; }\n\n.guard-pick { display: flex; gap: 6px; padding-top: 4px; }\n.guard-pick[hidden] { display: none; }\n.guard-pick select { flex: 1; min-width: 0; }\n.guard-pick .icon-btn { width: 30px; height: 30px; }\n\n/* ────────────────────────────────────────────────────────────── the guard ── */\n\n/* Carries the card's own look rather than the .card class, because call.js\n   rewrites this element's className wholesale to say how firm the answer is —\n   anything it did not write would be gone after the first frame. */\n.intent-strip {\n  display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px;\n  padding: 10px 14px; font-size: 12px;\n  background: var(--card); border: 1px solid var(--n200); border-radius: var(--r);\n}\n.intent-strip[hidden] { display: none; }\n.intent-label {\n  padding: 1px 8px; border-radius: var(--r-pill);\n  font-weight: 600; background: var(--n900); color: #fff;\n}\n.intent-strip.is-unclear .intent-label { background: var(--n200); color: var(--n800); }\n.intent-confidence { font-size: 11px; color: var(--n600); }\n.intent-strip.is-firm .intent-confidence { color: var(--a700); }\n.intent-why { flex-basis: 100%; color: var(--n700); line-height: 1.5; }\n\n.guard[hidden] { display: none; }\n.guard-bar {\n  display: flex; align-items: center; gap: 8px;\n  min-height: 44px; padding: 8px 14px; border-bottom: 1px solid var(--n200);\n}\n.guard-bar h2 { flex: none; }\n#guard-title {\n  padding: 1px 7px; border-radius: var(--r-pill); font-size: 10px; font-weight: 600;\n  background: var(--n200); white-space: nowrap; overflow: hidden;\n  text-overflow: ellipsis; max-width: 140px;\n}\n.guard-tally {\n  margin-left: auto; font-size: 11px; color: var(--n600); white-space: nowrap;\n}\n.guard-tally.good { color: #2f7a48; }\n.guard-tally.bad { color: var(--a700); font-weight: 600; }\n\n.guard-grid { display: flex; flex-direction: column; gap: 10px; padding: 10px 14px 12px; }\n\n/* — has everything required been said yet — */\n.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }\n.checks:empty { display: none; }\n.check { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; }\n.check.optional { opacity: .65; }\n.check-mark {\n  flex: none; margin-top: 3px; width: 12px; height: 12px; border-radius: 3px;\n  border: 1.5px solid var(--n400); background: transparent;\n}\n.check.is-met .check-mark { border-color: var(--ink); background: var(--ink); }\n.check.is-hearing .check-mark { border-color: var(--accent); animation: va-pulse 1.4s infinite; }\n.check > div { min-width: 0; display: flex; flex-direction: column; }\n.check-label { font-weight: 500; line-height: 1.4; }\n.check.is-missing .check-label { font-weight: 400; color: var(--n700); }\n.check-quote { font-size: 11px; color: var(--n600); line-height: 1.4; }\n\n/* — was something said that should not have been — */\n.flags { display: flex; flex-direction: column; gap: 8px; }\n.flags-empty { margin: 0; font-size: 11px; color: var(--n600); }\n.flags-empty[hidden] { display: none; }\n\n.flag {\n  display: flex; flex-direction: column; gap: 2px;\n  padding: 7px 10px; border-radius: 8px;\n  background: var(--n100); border: 1px solid var(--n200);\n  font-size: 12px; line-height: 1.5;\n}\n.flag b { font-weight: 600; }\n/* Confirmed is the one that counts, so it is the one that is loud. */\n.flag.is-confirmed { background: var(--a100); border-color: var(--a300); }\n/* Still in the part of the transcript the model may rewrite: shown, because\n   reacting while someone is still speaking is the entire point — but shown\n   hollow, and never counted. */\n.flag.is-provisional { border-style: dashed; }\n/* Confirmed and then taken back. Kept on screen, struck through, because a\n   flag that silently vanishes teaches people to distrust the panel more\n   thoroughly than a flag that was wrong. */\n.flag.is-retracted { opacity: .55; }\n.flag.is-retracted b, .flag.is-retracted .flag-quote { text-decoration: line-through; }\n/* The quote marks are guard.js's — it writes them into the text, because the\n   words are evidence and evidence is quoted at the point it is recorded, not\n   by a stylesheet that might not be loaded. */\n.flag-quote { color: var(--n800); }\n.flag-why { font-size: 11px; color: var(--n600); }\n.flag.sev-info { background: var(--n100); border-color: var(--n200); }\n\n.guard-note {\n  margin: 0; padding: 6px 14px; font-size: 10px; line-height: 1.45;\n  color: var(--n600); background: var(--n100); border-top: 1px solid var(--n200);\n}\n.guard-note:empty { display: none; }\n\n/* ──────────────────────────────────────────────────────────────── the chat ── */\n\n/* Where the real-time analysis panels stood. Same rail, same card, and\n   deliberately the same size: this is a place to ask one question and read one\n   answer while a call is running, not a second window to live in.\n\n   The log scrolls and the box does not move. A panel where the thing you type\n   into walks down the page as answers arrive is one you have to chase. */\n.chat[hidden] { display: none; }\n.chat-log {\n  display: flex; flex-direction: column; gap: 10px;\n  padding: 12px 14px; overflow-y: auto;\n  /* Tall enough for an answer, short enough to leave the transcript the page.\n     A summary of a long call runs past this and scrolls, which is the right\n     trade: the transcript is the product and this is commentary on it. */\n  max-height: 340px; min-height: 96px;\n}\n.chat-empty {\n  margin: auto 0; font-size: 11px; line-height: 1.55; color: var(--n600);\n}\n.chat-empty[hidden] { display: none; }\n\n.chat-turn { display: flex; font-size: 12px; line-height: 1.55; }\n/* The question sits right and tight, the way a sent message does everywhere\n   else; the answer takes the full width because it is the part being read. */\n.chat-turn.is-user { justify-content: flex-end; }\n.chat-turn.is-user .chat-body {\n  max-width: 85%; padding: 6px 10px; border-radius: 12px 12px 3px 12px;\n  background: var(--a100); color: var(--ink);\n}\n.chat-turn.is-assistant .chat-body { max-width: 100%; color: var(--n800); }\n/* Waiting, and saying so. A blank space while a model thinks is the state that\n   gets read as a broken panel. */\n.chat-turn.is-pending .chat-body { color: var(--n600); animation: va-pulse 1.4s infinite; }\n.chat-turn.is-failed .chat-body { color: var(--a700); }\n.chat-body > p { margin: 0 0 6px; }\n.chat-body > p:last-child { margin-bottom: 0; }\n.chat-body > ul { margin: 0 0 6px; padding-left: 16px; }\n.chat-body > ul:last-child { margin-bottom: 0; }\n.chat-body > ul > li { margin-bottom: 3px; }\n\n/* The offered questions. Wrapped rather than scrolled sideways: a chip that is\n   half off the edge is one nobody presses. */\n.chat-prompts {\n  display: flex; flex-wrap: wrap; gap: 6px;\n  padding: 0 14px 10px;\n}\n.chat-prompts:empty { display: none; }\n.chat-chip {\n  padding: 4px 10px; border-radius: var(--r-pill);\n  border: 1px solid var(--n300); background: var(--card);\n  font: inherit; font-size: 11px; color: var(--n800); cursor: pointer;\n}\n.chat-chip:hover { border-color: var(--accent); color: var(--a700); }\n.chat-chip:disabled { opacity: .5; cursor: not-allowed; }\n\n.chat-ask {\n  display: flex; align-items: flex-end; gap: 8px;\n  padding: 10px 14px; border-top: 1px solid var(--n200);\n}\n.chat-ask textarea {\n  flex: 1; min-width: 0; resize: none; overflow-y: auto;\n  padding: 7px 10px; border: 1px solid var(--n300); border-radius: 10px;\n  font: inherit; font-size: 12px; line-height: 1.5; color: var(--ink);\n  background: var(--card);\n}\n.chat-ask textarea:focus { outline: 2px solid var(--a300); outline-offset: -1px; }\n.chat-ask textarea:disabled { opacity: .6; }\n.chat-ask .sheet-go { flex: none; }\n\n.chat-note {\n  margin: 0; padding: 6px 14px 10px; font-size: 11px; line-height: 1.45;\n  color: var(--n600);\n}\n.chat-note.warn { color: var(--a700); }\n.chat-note[hidden] { display: none; }\n\n/* ──────────────────────────────────────────────────────────── the customer ── */\n\n/* The picker and the briefing, above the panel that reads them.\n *\n * Above on purpose: it is the thing set before the call, like the audio source,\n * and it changes what every note below it means. */\n.customer[hidden] { display: none; }\n\n/* Out of its own corners, for the same reason .controls is: the only thing that\n   leaves this card is a dropdown, and a dropdown clipped to the box that opens it\n   is a dropdown nobody can see.\n   ==================================================\n   This was the bug. `.card` clips its children so nothing paints over the rounded\n   corners, and the list is absolutely positioned BELOW the box that opens it —\n   so with no customer chosen, and the briefing card therefore empty, the card was\n   only as tall as its header and its input. The list opened into the clipped\n   region every time and the control read as dead: press it, nothing happens.\n\n   Worth knowing because the symptom points at the wrong file. Nothing in\n   customer.js is wrong — it fills the list, unhides it and reports\n   aria-expanded=\"true\" — so every check that does not involve the cascade passes,\n   which is exactly what the harness cannot see. */\n.customer { overflow: visible; }\n\n/* Breathing room under the search box when there is no briefing below it.\n *\n * Put on the CARD rather than as bottom padding on `.customer-pick`, and that is\n * not a style preference: the dropdown is positioned at `top: calc(100% + 3px)`\n * of the pick row, so padding there would push the list 10px further from the box\n * that opens it. The space is wanted at the card's edge, so it belongs on the\n * card's edge.\n *\n * Conditional because when a customer IS chosen the briefing's own bottom padding\n * already does the job, and both would read as a gap nobody put there. `:has()`\n * is the same mechanism `.help` and `#row-mute` already use in this sheet. */\n.customer:has(.brief[hidden]) { padding-bottom: 12px; }\n\n.customer-pick { position: relative; padding: 10px 14px 0; }\n.customer-pick input {\n  /* Room on the right for the caret, so a long name does not run under it. */\n  width: 100%; height: 30px; padding: 0 32px 0 9px;\n  background: var(--n100); border: 1px solid var(--n300); border-radius: var(--r-sm);\n  font: inherit; font-size: 12px;\n}\n.customer-pick input:focus { outline: 2px solid var(--a300); outline-offset: -1px; }\n\n/* The dropdown arrow, and it is not decoration: typing to filter was the only\n   way in, so a box with a placeholder read as a search field and somebody who did\n   not know the ten names had nothing to click. */\n.customer-caret {\n  position: absolute; right: 15px; top: 10px;\n  display: grid; place-items: center; width: 30px; height: 30px;\n  border: 0; border-radius: 0 var(--r-sm) var(--r-sm) 0;\n  background: transparent; color: var(--n600); cursor: pointer;\n}\n.customer-caret:hover { color: var(--ink); }\n.customer-caret > svg { transition: transform .15s; }\n.customer-caret.is-open > svg { transform: rotate(180deg); }\n@media (prefers-reduced-motion: reduce) {\n  .customer-caret > svg { transition: none; }\n}\n\n/* Over the content rather than pushing it down. A list that reflowed the card\n   below it would make the briefing jump every time the box was focused, and the\n   briefing is the thing being read. */\n.customer-list {\n  position: absolute; left: 14px; right: 14px; top: calc(100% + 3px); z-index: 12;\n  max-height: 260px; overflow-y: auto;\n  background: var(--card); border: 1px solid var(--n300); border-radius: var(--r-sm);\n  box-shadow: var(--shadow-lg);\n}\n.customer-list[hidden] { display: none; }\n\n.customer-option {\n  display: flex; flex-direction: column; gap: 1px; width: 100%;\n  padding: 6px 10px; border: 0; border-bottom: 1px solid var(--n200);\n  background: transparent; text-align: left; font: inherit; cursor: pointer;\n}\n.customer-option:last-child { border-bottom: 0; }\n.customer-option > b { font-size: 12px; font-weight: 600; color: var(--ink); }\n.customer-option > span { font-size: 10px; color: var(--n600); }\n/* One highlight for hover and for the keyboard cursor, because they are one\n   thing: which row Enter would take. */\n.customer-option.is-on, .customer-option:hover { background: var(--a100); }\n.customer-none { margin: 0; padding: 8px 10px; font-size: 11px; color: var(--n600); }\n\n/* — the briefing — */\n\n.brief { padding: 10px 14px 12px; }\n.brief[hidden] { display: none; }\n.brief-head { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }\n.brief-head > b { font-size: 13px; font-weight: 600; }\n.brief-tags { font-size: 11px; color: var(--n600); }\n.brief-facts { margin: 2px 0 0; font-size: 11px; line-height: 1.5; color: var(--n700); }\n\n.brief-section { margin-top: 10px; }\n.brief-section > h3 {\n  margin: 0 0 4px; font-size: 10px; font-weight: 600; letter-spacing: .04em;\n  text-transform: uppercase; color: var(--n500);\n}\n.brief-activity { margin: 0; padding-left: 15px; font-size: 11px; line-height: 1.5; }\n.brief-activity > li { margin-bottom: 2px; color: var(--n800); }\n\n/* The line that stops the table being misread, so it is not allowed to be quiet\n   enough to skip. A column of percentages beside a customer's name reads as fact;\n   these are model output about somebody who has said nothing. */\n.brief-caveat {\n  margin: 0 0 5px; padding: 5px 7px; border-radius: var(--r-sm);\n  background: var(--n100); font-size: 10px; line-height: 1.45; color: var(--n700);\n}\n\n.brief-scores { display: flex; flex-direction: column; gap: 3px; }\n.brief-score { display: grid; grid-template-columns: 1fr 64px 30px; align-items: center; gap: 6px; }\n.brief-score-name {\n  min-width: 0; font-size: 11px; color: var(--n800);\n  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\n}\n.brief-bar { height: 5px; border-radius: var(--r-pill); background: var(--n200); overflow: hidden; }\n.brief-bar > i { display: block; height: 100%; background: var(--n500); }\n.brief-score-value {\n  font-family: var(--mono); font-size: 10px; text-align: right; color: var(--n700);\n}\n/* Three bands rather than a gradient. The question an RM asks of this table is\n   \"which of these is worth raising\", which is a three-way answer — worth it, not\n   worth it, and the middle the model has no strong view on. A continuous colour\n   ramp implies a precision these numbers do not have. */\n.brief-score.is-high > .brief-bar > i { background: var(--accent); }\n.brief-score.is-high > .brief-score-value { color: var(--a700); font-weight: 600; }\n.brief-score.is-low > .brief-score-name,\n.brief-score.is-low > .brief-score-value { color: var(--n500); }\n.brief-score.is-low > .brief-bar > i { background: var(--n300); }\n\n.brief-note {\n  margin: 0; padding: 6px 8px; border-radius: var(--r-sm);\n  background: var(--n100); font-size: 11px; line-height: 1.5; color: var(--n800);\n}\n/* Last, small, and present on every record. The demo this belongs to is\n   convincing enough that its being a demo has to be written down. */\n.brief-sample {\n  margin: 10px 0 0; padding-top: 7px; border-top: 1px solid var(--n200);\n  font-size: 10px; color: var(--n500);\n}\n\n/* ────────────────────────────────────────────────────────────── the assist ── */\n\n/* The proactive panel, above the one that waits to be asked.\n *\n * It looks different from the chat on purpose, and the difference is the one\n * thing about this panel that carries meaning: nothing here was requested. A note\n * is a small card with a source and a time on it, because the first question\n * about text that appeared on its own is \"who said this and when\", and the second\n * is \"what did it think I was asking\" — which is the line under the name.\n *\n * The chat below is a conversation and reads downwards. This is a feed and reads\n * from the top: the reader is mid-sentence on a call and the useful note is\n * always the newest, so it goes where the eye already is. */\n.assist[hidden] { display: none; }\n\n/* The same height as the transcript, off the same variable.\n *\n * They are read together — a note and the words it answers — and either grip\n * resizes both, so the two columns cannot drift out of step. It was a fixed\n * max-height, which left the assist panel a third of the transcript's height and\n * scrolling inside itself while there was empty column below it. */\n.assist-list {\n  display: flex; flex-direction: column; gap: 8px;\n  padding: 12px 14px; overflow-y: auto;\n  flex: 1 1 auto; height: auto; min-height: 0;\n}\n.assist-empty { margin: auto 0; font-size: 11px; line-height: 1.55; color: var(--n600); }\n.assist-empty[hidden] { display: none; }\n\n.assist-note {\n  padding: 9px 11px; border-radius: var(--r-sm);\n  /* Indirected through a variable so the arrival animation can end on whatever\n     this note's own background is. Without that, va-arrive finishes on a literal\n     --n100 and washes a categorised note's tint off a second after it lands. */\n  --note-bg: var(--n100);\n  background: var(--note-bg);\n  /* The one piece of decoration in here that is load-bearing. The bar is the\n     agent's colour on the card, so two agents' notes are told apart before either\n     is read — which is what makes more than one agent usable at all. An agent\n     that categorises its notes overrides it below: then the bar says what KIND\n     of note this is, which is the more useful question when one agent runs. */\n  border-left: 3px solid var(--n400);\n}\n.assist-note > header {\n  display: flex; align-items: baseline; gap: 6px; margin-bottom: 4px;\n}\n/* No rule for the agent's name, because the note does not carry one: the\n   dropdown above the feed names the agent, one listens at a time, and repeating\n   it on every card spent the header on something already on screen. Which agent\n   wrote a note is the coloured bar, as it always was. */\n/* What the agent thought it was answering. Small, quiet, and the fastest way to\n   dismiss a wrong note: an answer about the annual fee under a cue that reads\n   \"miles expiry\" is something the eye rejects without having to read the\n   answer. Now the first thing in the header, so it gets the weight the name\n   used to take. */\n.assist-about {\n  min-width: 0; flex: 1;\n  font-size: 10px; color: var(--n600);\n  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\n}\n/* Who the note was written about. Present only once a customer is selected, and\n   quiet: it is there to be checked, not read every time. */\n.assist-for {\n  flex: none; padding: 0 5px; border-radius: var(--r-pill);\n  background: var(--n200); font-size: 10px; color: var(--n700);\n  max-width: 96px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\n}\n/* Pushed right by its own margin rather than by whatever happens to sit to its\n   left. That used to be the cue, which is the flexible one — but the cue is the\n   model's and can come back empty, and with the agent's name gone there is\n   nothing else in the header guaranteed to be there. A timestamp alone on the\n   left is what that looked like. */\n.assist-when {\n  flex: none; margin-left: auto;\n  font-family: var(--mono); font-size: 10px; color: var(--n500);\n}\n/* What the note is answering, in the speaker's own words.\n *\n * Quiet and italic, and it reads as a quotation rather than as part of the note:\n * these are somebody else's words inside the agent's card, and the one thing this\n * must never do is look like something the agent said. `q` draws no marks of its\n * own here — the ones below are chosen to match the page. */\n.assist-quote {\n  display: block; margin: 0 0 5px;\n  font-size: 11px; line-height: 1.45; font-style: italic; color: var(--n600);\n}\n.assist-quote::before { content: 'C'; }\n.assist-quote::after { content: 'D'; }\n\n.assist-body { font-size: 12px; line-height: 1.55; color: var(--ink); }\n.assist-body > p { margin: 0 0 5px; }\n.assist-body > p:last-child { margin-bottom: 0; }\n.assist-body > ul { margin: 0 0 5px; padding-left: 15px; }\n.assist-body > ul:last-child { margin-bottom: 0; }\n.assist-body > ul > li { margin-bottom: 2px; }\n\n/* ── the three kinds of note ──────────────────────────────────────────────\n *\n * An agent whose prompt defines the categories returns one on every note, and\n * the colour is how the reader sorts the feed before reading a sentence of it:\n * green is the answer, red is a wrong figure already in the customer's ear,\n * amber is the customer saying something about the bank that is not a question.\n *\n * Colour alone is not the signal. Red and green are the pair the commonest form\n * of colour blindness cannot separate, and this is a panel read at a glance in\n * peripheral vision by somebody mid-sentence — so every note also carries its\n * kind in words (.assist-kind), and the colour is the fast path rather than the\n * only one.\n *\n * An agent that does NOT categorise keeps the per-agent hue on its bar, which is\n * what these override. Both are true at once on a deployment running one of each,\n * and they do not collide: a note has a kind or it has an agent colour. */\n.assist-note.is-insight {\n  --note-bg: var(--g100);\n  border-left-color: var(--g600);\n}\n.assist-note.is-insight .assist-kind {\n  color: var(--g700); background: var(--g200);\n}\n\n/* A note that contradicts what the staff member has just told the customer. The\n   only thing on this panel that has to be read before the next sentence, so it is\n   the only thing allowed the accent. */\n.assist-note.is-correction {\n  --note-bg: var(--a100);\n  border-left-color: var(--accent);\n}\n.assist-note.is-correction .assist-kind {\n  color: var(--a700); background: var(--a200);\n}\n\n/* Not an answer, and the only note here whose subject is the bank rather than a\n   product. Amber because it is neither \"say this now\" nor \"this is the figure\":\n   it is something to carry off the call, and it should catch the eye once\n   without competing with a correction for it. */\n.assist-note.is-feedback {\n  --note-bg: var(--y100);\n  border-left-color: var(--y600);\n}\n.assist-note.is-feedback .assist-kind {\n  color: var(--y700); background: var(--y200);\n}\n\n/* The kind, in words. First in the header now that the agent's name is gone,\n   because with one agent listening the useful question is not who wrote this but\n   what sort of note it is. */\n.assist-kind {\n  flex: none; padding: 0 5px; border-radius: var(--r-pill);\n  font-size: 10px; font-weight: 600; letter-spacing: 0.01em;\n  white-space: nowrap;\n}\n\n/* Not a note at all: the agent is not working. Shown rather than swallowed,\n   because an agent with nothing to say and an agent whose every request is\n   failing look identical on screen and only one of them is something the reader\n   needs to know before they answer a customer. */\n.assist-note.is-failed {\n  background: transparent; border: 1px dashed var(--a300); border-left-width: 3px;\n  border-left-style: solid; border-left-color: var(--a400);\n}\n.assist-note.is-failed .assist-body { color: var(--a700); }\n\n/* Arriving. A quick wash of the accent rather than a slide or a fade-in: the\n   panel is in peripheral vision while somebody talks, and movement there pulls\n   the eye off the person they are listening to. Colour does not.\n\n   It ends on --note-bg rather than on a literal, so a categorised note settles\n   back to its own tint instead of having it wiped a second after it lands. That\n   replaces an exemption that switched the animation off for corrections\n   entirely: the exemption was there to protect the tint, and cost the one note\n   that most needs announcing the only announcement this panel makes. */\n@keyframes va-arrive {\n  0% { background: var(--a200); }\n  100% { background: var(--note-bg); }\n}\n.assist-note.is-fresh { animation: va-arrive 1.6s ease-out; }\n\n/* The badge says what the panel is DOING. Producing nothing is this feature's\n   normal state, so without this it is indistinguishable from a broken one. */\n/* Short enough now to need no width exception — and capped rather than\n   unbounded, so a future state with a longer name ellipsises instead of pushing\n   the two buttons beside it onto a line of their own. */\n.assist-badge { font-weight: 500; max-width: 150px; }\n.assist-badge.is-off { background: var(--n200); color: var(--n600); }\n.assist-badge.is-paused { background: var(--n300); color: var(--n800); }\n.assist-badge.is-live { background: var(--n900); color: #fff; }\n.assist-badge.is-live::before {\n  content: ''; display: inline-block; width: 5px; height: 5px; margin-right: 5px;\n  border-radius: 50%; background: var(--a400); animation: va-pulse 1.6s infinite;\n  vertical-align: 1px;\n}\n\n.assist-note-line {\n  margin: 0; padding: 0 14px 10px; font-size: 11px; line-height: 1.45;\n  color: var(--n600);\n}\n.assist-note-line.warn { color: var(--a700); }\n.assist-note-line[hidden] { display: none; }\n\n/* One row, the same shape the transcript's head has: title, state, then the\n   controls pushed to the right-hand edge.\n   ==================================================\n   It was split into two placed rows, because in a 300px rail one row wrapped and\n   put the agent's name alone on a second line. The assist panel is a COLUMN now and\n   can be dragged as wide as the row allows, so the width that forced the split is\n   not the width it lives at — and two rows of chrome over a reading panel is a\n   header taller than it needs to be.\n   It still wraps when it has to, exactly as the transcript's does at a narrow\n   width. What is different from the version that wrapped badly is that the whole\n   control group wraps as one unit rather than one select breaking away from it. */\n.assist-head { row-gap: 6px; }\n.assist-acts { align-items: center; }\n.assist-acts select { height: 24px; max-width: 240px; min-width: 0; }\n.assist .head-picks .tbtn { height: 24px; }\n/* Off is the default, and the control should not look like something is running\n   while it is. The accent border is earned by a selection. */\n.assist .head-picks select:not([data-on]) { color: var(--n600); }\n.assist .head-picks select[data-on] { border-color: var(--accent); color: var(--ink); }\n\n/* A dot that means \"costing something\", not \"running\". Hollow rather than solid,\n   because the solid one in the rail above it means a live session and two dots\n   that look the same and mean different things is worse than no second dot. */\n.side-live.is-quiet {\n  background: transparent; border: 1.5px solid var(--a400); animation: none;\n}\n\n/* ─────────────────────────────────────────────────────────────── the roster ── */\n\n.agent-rows { display: flex; flex-direction: column; }\n.agent-row {\n  display: flex; flex-direction: column; gap: 5px;\n  padding: 12px 14px; border-bottom: 1px solid var(--n200);\n}\n.agent-row:last-child { border-bottom: 0; }\n/* The agent's own colour, only once JavaScript has supplied one: a 3px stripe\n   with no colour in it would be a grey bar down the side of every row. */\n.agent-row.has-accent { border-left: 3px solid var(--n400); padding-left: 11px; }\n/* An agent that is on costs a request every few seconds on every call. The row\n   says so with a tint rather than a badge, so the answer to \"what is running on\n   this deployment\" is the shape of the list and not something to be read. */\n.agent-row.is-on { b
